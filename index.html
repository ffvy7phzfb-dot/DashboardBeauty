<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Дашборд</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root {
  --c-bg:#F7F8FA; --c-surface:#FFFFFF; --c-surface-2:#F1F3F7;
  --c-text:#1C1C1E; --c-text-2:#5A5F6B; --c-text-3:#9AA0AC;
  --c-border:#E4E7ED; --c-border-soft:#EEF0F4;
  --c-primary:#3B82F6; --c-primary-hover:#2563EB; --c-primary-soft:#DBEAFE;
  --c-red:#EF4444; --c-red-soft:#FEE2E2; --c-red-text:#B91C1C;
  --c-green:#22C55E; --c-green-soft:#DCFCE7; --c-green-text:#166534;
  --c-orange:#F97316; --c-orange-soft:#FFEDD5; --c-orange-text:#C2410C;
  --c-purple:#A855F7;
  --f-sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --f-mono:'SF Mono','Menlo',monospace;
  --r-md:8px; --r-lg:14px;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{font-family:var(--f-sans); background:var(--c-bg); color:var(--c-text); font-size:14px; line-height:1.5;}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
input,select,textarea{font-family:inherit; font-size:14px; padding:8px 12px; border:1px solid var(--c-border); border-radius:var(--r-md); background:var(--c-surface); color:var(--c-text); width:100%;}
input:focus,select:focus,textarea:focus{outline:none; border-color:var(--c-primary);}
textarea{min-height:80px; resize:vertical;}

/* auth */
#authScreen{position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:var(--c-bg); z-index:1000;}
.auth-card{background:var(--c-surface); padding:32px; border-radius:var(--r-lg); box-shadow:0 4px 24px rgba(0,0,0,0.08); width:360px;}
.auth-card h2{margin-bottom:20px; font-size:22px;}
.auth-card .field-group{margin-bottom:14px;}
.auth-card label{display:block; font-size:12px; color:var(--c-text-2); margin-bottom:6px; font-weight:600;}
.pass-wrap{position:relative;}
.pass-wrap input{padding-right:40px;}
#authEye{position:absolute; right:10px; top:50%; transform:translateY(-50%); cursor:pointer; font-size:16px; opacity:0.6;}
#authSubmit{width:100%; padding:12px; background:var(--c-primary); color:#FFF; border-radius:var(--r-md); font-weight:600; font-size:14px;}
#authSubmit:disabled{opacity:0.6;}
#authError{color:var(--c-red); font-size:13px; margin-bottom:12px; display:none;}
#authError.show{display:block;}
.spinner{display:inline-block; width:14px; height:14px; border:2px solid rgba(255,255,255,0.3); border-top-color:#FFF; border-radius:50%; animation:spin 0.8s linear infinite; margin-right:8px; vertical-align:middle;}
@keyframes spin{to{transform:rotate(360deg);}}

/* app */
#appScreen{display:none; padding:20px 28px; max-width:1600px; margin:0 auto;}
.top-bar{display:flex; justify-content:space-between; align-items:center; margin-bottom:18px;}
.top-bar h1{font-size:22px; font-weight:700;}
.btn-logout{padding:8px 16px; background:var(--c-surface); border:1px solid var(--c-border); border-radius:var(--r-md); font-size:13px;}

/* main tabs */
.main-tabs{display:flex; gap:6px; margin-bottom:18px; flex-wrap:wrap; border-bottom:1px solid var(--c-border); padding-bottom:0;}
.main-tab-btn{padding:10px 16px; font-size:14px; font-weight:600; color:var(--c-text-2); border-radius:var(--r-md) var(--r-md) 0 0; position:relative; bottom:-1px; border:1px solid transparent; border-bottom:none;}
.main-tab-btn.active{color:var(--c-primary); background:var(--c-surface); border-color:var(--c-border); border-bottom:1px solid var(--c-surface);}
.main-tab-btn:hover{color:var(--c-text);}

.tab-content{display:none;}
.tab-content.active{display:block;}

.panel{background:var(--c-surface); border-radius:var(--r-lg); padding:20px; margin-bottom:16px; border:1px solid var(--c-border);}
.field-group{margin-bottom:14px;}
.field-group label{display:block; font-size:12px; color:var(--c-text-2); margin-bottom:6px; font-weight:600;}
.data-inputs{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:14px;}
.data-inputs textarea{min-height:140px; font-family:var(--f-mono); font-size:12px;}
.btn-load{padding:10px 20px; background:var(--c-primary); color:#FFF; border-radius:var(--r-md); font-weight:600; font-size:14px;}
.btn-load:disabled{opacity:0.5;}

/* filters */
#filtersPanel{display:none; margin-bottom:16px;}
#marksPanel{display:none; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:16px;}
.color-swatch{width:28px; height:28px; border-radius:50%; cursor:pointer; border:2px solid transparent;}
.color-swatch.active{border-color:var(--c-text);}
.swatch-red{background:#EF4444;} .swatch-orange{background:#F97316;} .swatch-yellow{background:#FACC15;}
.swatch-green{background:#22C55E;} .swatch-blue{background:#3B82F6;} .swatch-purple{background:#A855F7;}
.swatch-gray{background:#6B7280;} .swatch-none{background:repeating-linear-gradient(45deg,#FFF,#FFF 4px,#E5E7EB 4px,#E5E7EB 8px);}
#brushToggle{padding:8px 14px; border:1px solid var(--c-border); border-radius:var(--r-md); font-size:13px;}
#brushToggle.active{background:var(--c-primary); color:#FFF; border-color:var(--c-primary);}

/* summary table */
.summary-table{width:100%; border-collapse:collapse; font-size:13px;}
.summary-table th,.summary-table td{padding:8px 10px; border-bottom:1px solid var(--c-border-soft); text-align:center;}
.summary-table th{background:var(--c-surface-2); font-weight:600; font-size:12px; color:var(--c-text-2); position:sticky; top:0;}
.summary-table tbody tr:hover{background:var(--c-surface-2);}
.summary-table .name-col{text-align:left; font-weight:600; cursor:pointer;}
.summary-table .name-col:hover{color:var(--c-primary);}
.summary-table .total-row{background:var(--c-primary-soft); font-weight:700;}
.summary-table .zero-cell{color:#CBD5E1;}
.summary-table .id-col{font-family:var(--f-mono); font-size:11px; color:var(--c-text-3);}
.status-select{padding:3px 6px; font-size:12px; border-radius:6px; border:1px solid var(--c-border);}

.paint-red{background:#FEE2E2 !important;} .paint-orange{background:#FFEDD5 !important;}
.paint-yellow{background:#FEF9C3 !important;} .paint-green{background:#DCFCE7 !important;}
.paint-blue{background:#DBEAFE !important;} .paint-purple{background:#F3E8FF !important;}
.paint-gray{background:#F3F4F6 !important;}

/* progress / kpi */
.progress-kpi-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; margin-bottom:18px;}
.progress-kpi{background:var(--c-surface); padding:14px 16px; border-radius:var(--r-md); border:1px solid var(--c-border); border-left:3px solid var(--c-text-3);}
.progress-kpi .lbl{font-size:11px; color:var(--c-text-2); text-transform:uppercase; font-weight:600; letter-spacing:0.4px;}
.progress-kpi .val{font-size:24px; font-weight:700; margin-top:4px; letter-spacing:-0.5px;}
.progress-kpi .val small{font-size:13px; font-weight:500; color:var(--c-text-3);}
.progress-kpi .sub{font-size:11px; color:var(--c-text-3); margin-top:2px;}
.progress-table-wrap{overflow-x:auto; border-radius:var(--r-md); border:1px solid var(--c-border);}
.progress-table{width:100%; border-collapse:collapse; font-size:13px;}
.progress-table th,.progress-table td{padding:8px 10px; border-bottom:1px solid var(--c-border-soft); text-align:center;}
.progress-table th{background:var(--c-surface-2); font-weight:600; font-size:12px; color:var(--c-text-2);}
.progress-table .period-col{text-align:left; font-weight:600;}
.progress-table tbody tr:hover{background:var(--c-surface-2);}

.q-red{background:#FEE2E2 !important; color:#B91C1C !important;}
.q-orange{background:#FFEDD5 !important; color:#C2410C !important;}
.q-green{background:#DCFCE7 !important; color:#166534 !important;}

.trend-down{color:var(--c-green); font-weight:700;}
.trend-up{color:var(--c-red); font-weight:700;}
.trend-flat{color:var(--c-text-3);}

.badge{display:inline-block; padding:2px 8px; border-radius:12px; font-size:11px; font-weight:700; text-transform:uppercase;}
.badge-good{background:var(--c-green-soft); color:var(--c-green-text);}
.badge-warn{background:var(--c-orange-soft); color:var(--c-orange-text);}
.badge-bad{background:var(--c-red-soft); color:var(--c-red-text);}
.badge-status{display:inline-block; padding:3px 8px; border-radius:10px; font-size:11px; font-weight:600;}
.badge-good.badge-status{background:var(--c-green-soft); color:var(--c-green-text);}
.badge-warn.badge-status{background:var(--c-orange-soft); color:var(--c-orange-text);}
.badge-bad.badge-status{background:var(--c-red-soft); color:var(--c-red-text);}

/* tabs list */
#tabsSection{display:none; margin-top:16px;}
#tabsSearch{max-width:280px; margin-bottom:10px;}
#tabsList{display:flex; gap:6px; flex-wrap:wrap;}
.tab-btn{padding:6px 12px; background:var(--c-surface); border:1px solid var(--c-border); border-radius:var(--r-md); font-size:12px;}
.tab-btn:hover{border-color:var(--c-primary); color:var(--c-primary);}
.tab-btn.archived{opacity:0.5;}

/* charts */
.chart-box{height:320px; margin-bottom:16px;}

/* week progress */
#weekProgressBlock{display:none;}

/* quality chips */
.q-emp-chip{display:inline-flex; align-items:center; gap:5px; padding:4px 10px; background:var(--c-surface-2); border-radius:14px; font-size:12px; cursor:pointer; border:1px solid transparent; margin:2px;}
.q-emp-chip.checked{background:var(--c-primary-soft); border-color:var(--c-primary);}
.q-emp-chip input{width:auto; margin:0;}

/* modal */
.modal-overlay{position:fixed; inset:0; background:rgba(0,0,0,0.4); display:none; align-items:center; justify-content:center; z-index:500; padding:20px;}
.modal-overlay.open{display:flex;}
.modal{background:var(--c-surface); padding:28px; border-radius:var(--r-lg); max-width:700px; width:100%; max-height:90vh; overflow-y:auto; position:relative;}
.modal-close{position:absolute; top:12px; right:16px; font-size:24px; color:var(--c-text-3); width:32px; height:32px; border-radius:50%;}
.modal-close:hover{background:var(--c-surface-2); color:var(--c-text);}
.modal h2,.modal h3{margin-bottom:8px;}
.modal .subline{font-size:13px; color:var(--c-text-2); margin-bottom:16px; font-family:var(--f-mono);}
.modal-actions{display:flex; gap:10px; justify-content:flex-end; margin-top:18px; flex-wrap:wrap;}
.btn-save{padding:10px 20px; background:var(--c-primary); color:#FFF; border-radius:var(--r-md); font-weight:600;}
.btn-cancel{padding:10px 20px; background:var(--c-surface-2); border-radius:var(--r-md); font-weight:600;}
.btn-archive{padding:10px 20px; background:var(--c-red-soft); color:var(--c-red-text); border-radius:var(--r-md); font-weight:600;}
.btn-unarchive{padding:10px 20px; background:var(--c-green-soft); color:var(--c-green-text); border-radius:var(--r-md); font-weight:600;}

.card-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin-bottom:16px;}
.card-block{background:var(--c-surface-2); border-radius:var(--r-md); padding:14px 16px; border-left:3px solid var(--c-text-3); margin-bottom:12px;}
.card-block h4{font-size:12px; text-transform:uppercase; color:var(--c-text-2); font-weight:600; margin-bottom:8px; letter-spacing:0.4px;}
.stat-big{font-size:28px; font-weight:700;}
.cat-table{width:100%; font-size:13px;}
.cat-table td{padding:6px 8px; border-bottom:1px solid var(--c-border);}
.cat-table td:last-child{text-align:right; font-weight:700; font-family:var(--f-mono);}

.comments-list{max-height:300px; overflow-y:auto;}
.comment-item{background:var(--c-surface); padding:10px 12px; border-radius:var(--r-md); border-left:3px solid var(--c-border); margin-bottom:8px;}
.comment-date{font-family:var(--f-mono); font-size:11px; color:var(--c-text-3); margin-right:8px;}
.comment-cat{font-size:11px; background:var(--c-primary-soft); color:var(--c-primary-hover); padding:2px 8px; border-radius:10px; font-weight:600;}

/* VKS calendar */
.vks-block{margin-bottom:16px;}
.vks-header{display:flex; align-items:center; gap:8px; margin-bottom:10px;}
.vks-header h4{flex:1; margin:0;}
.vks-nav{width:28px; height:28px; border-radius:50%; background:var(--c-surface); border:1px solid var(--c-border);}
.vks-month-title{font-size:13px; font-weight:600;}
.vks-calendar{display:grid; grid-template-columns:repeat(7,1fr); gap:4px;}
.vks-dow{text-align:center; font-size:11px; color:var(--c-text-3); font-weight:600; padding:4px;}
.vks-day{background:var(--c-surface); border:1px solid var(--c-border-soft); border-radius:6px; padding:4px; min-height:48px; font-size:11px; position:relative; cursor:pointer;}
.vks-day:hover{border-color:var(--c-primary);}
.vks-day.empty{background:transparent; border:none; cursor:default;}
.vks-day.has-vks{background:var(--c-primary-soft);}
.vks-day-num{font-weight:600;}
.vks-day-cat{font-size:9px; font-weight:700; margin-top:2px;}
.vks-day-comment{font-size:9px; color:var(--c-text-2); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.vks-cat-individual{color:var(--c-purple);}
.vks-cat-general{color:var(--c-primary);}
.vks-cat-master{color:var(--c-orange);}
.vks-day-plus{position:absolute; bottom:2px; right:4px; font-size:12px; color:var(--c-text-3);}
.vks-date-label{font-size:12px; color:var(--c-text-2); margin-bottom:14px;}

.links-list{margin-bottom:8px;}
.link-row{display:flex; align-items:center; gap:8px; padding:6px 0;}
.link-row a{flex:1; color:var(--c-primary); text-decoration:none; font-size:13px;}
.link-row a:hover{text-decoration:underline;}
.link-row button{width:24px; height:24px; border-radius:50%; background:var(--c-red-soft); color:var(--c-red-text); font-size:14px;}
.link-add-row{display:grid; grid-template-columns:1fr 2fr auto; gap:6px;}
.link-add-row button{padding:8px 14px; background:var(--c-primary); color:#FFF; border-radius:var(--r-md); font-size:13px;}

/* toast */
#saveToast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%); padding:10px 20px; background:var(--c-text); color:#FFF; border-radius:24px; font-size:13px; opacity:0; pointer-events:none; transition:opacity 0.3s; z-index:2000;}
#saveToast.show{opacity:1;}

/* report-specific */
.rep-cat-link{color:var(--c-primary); text-decoration:none; font-weight:600; cursor:pointer;}
.rep-cat-link:hover{text-decoration:underline;}
@media print {
  .main-tabs, #filtersPanel, #marksPanel, .top-bar, .modal-close, .modal-actions, .chart-box canvas { display:none !important; }
  #appScreen { padding:0; }
  .panel { box-shadow:none; border:none; }
  body { background:#FFF; }
}
</style>
</head>
<body>

<div id="authScreen">
  <div class="auth-card">
    <h2>Вход</h2>
    <div id="authError"></div>
    <div class="field-group">
      <label>Email</label>
      <input type="email" id="authEmail" placeholder="you@example.com">
    </div>
    <div class="field-group">
      <label>Пароль</label>
      <div class="pass-wrap">
        <input type="password" id="authPassword" placeholder="••••••••">
        <span id="authEye" onclick="togglePassword()">👁</span>
      </div>
    </div>
    <button id="authSubmit" onclick="doLogin()">Войти</button>
  </div>
</div>

<div id="appScreen">
  <div class="top-bar">
    <h1>Дашборд качества</h1>
    <div style="display:flex; gap:10px;">
      <button class="btn-logout" onclick="manualSaveToCloud()">☁️ Сохранить</button>
      <button class="btn-logout" onclick="logoutUser()">Выйти</button>
    </div>
  </div>

  <div class="main-tabs">
    <button class="main-tab-btn active" onclick="switchTab('summary', this)">Сводка</button>
    <button class="main-tab-btn" onclick="switchTab('dynamics', this)">Динамика</button>
    <button class="main-tab-btn" onclick="switchTab('progress', this)">Прогресс</button>
    <button class="main-tab-btn" onclick="switchTab('quality', this)">Качество</button>
    <button class="main-tab-btn" onclick="switchTab('compare', this)">Сравнение</button>
    <button class="main-tab-btn" onclick="switchTab('ai-analysis', this)">AI-анализ</button>
    <button class="main-tab-btn" onclick="switchTab('manager-report', this)">📋 Итоговый отчёт</button>
  </div>

  <div class="tab-content active" id="tab-summary">
    <div class="panel">
      <div class="data-inputs">
        <div class="field-group">
          <label>Данные (marker_id, дата, качество, комментарий)</label>
          <textarea id="mainData" placeholder="вставь данные..."></textarea>
        </div>
        <div class="field-group">
          <label>Справочник (ФИО + marker_id)</label>
          <textarea id="namesData" placeholder="Иванов Иван&#9;abc123-..."></textarea>
        </div>
      </div>
      <div style="display:flex; gap:10px; flex-wrap:wrap;">
        <button class="btn-load" onclick="processData()">Обработать</button>
        <button class="btn-load" id="exportBtn" style="display:none; background:var(--c-green);" onclick="exportToExcel()">📊 Экспорт Excel</button>
        <label class="btn-load" style="display:inline-block;">
          📥 Импорт предыдущего
          <input type="file" id="importFile" accept=".xlsx" style="display:none;" onchange="importPreviousXlsx(event)">
        </label>
      </div>
      <div id="importStatus" style="margin-top:10px; font-size:13px;"></div>
    </div>

    <div class="panel" id="filtersPanel">
      <div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px;">
        <div class="field-group" style="margin:0;"><label>Сотрудник</label><select id="filterUser" onchange="applyFilters()"><option value="all">все</option></select></div>
        <div class="field-group" style="margin:0;"><label>Дата с</label><input type="date" id="filterDateFrom" onchange="applyFilters()"></div>
        <div class="field-group" style="margin:0;"><label>Дата по</label><input type="date" id="filterDateTo" onchange="applyFilters()"></div>
        <div class="field-group" style="margin:0;"><label>Пометка</label>
          <select id="filterMark" onchange="applyFilters()">
            <option value="all">все</option><option value="newbie">новичок</option><option value="experienced">опытный</option><option value="none">без пометки</option>
          </select></div>
        <div class="field-group" style="margin:0;"><label>Цвет</label>
          <select id="filterPaint" onchange="applyFilters()">
            <option value="all">все</option><option value="red">красный</option><option value="orange">оранжевый</option><option value="yellow">жёлтый</option><option value="green">зелёный</option><option value="blue">синий</option><option value="purple">фиолетовый</option><option value="gray">серый</option>
          </select></div>
      </div>
      <button class="btn-logout" style="margin-top:10px;" onclick="resetFilters()">сбросить фильтры</button>
    </div>

    <div id="marksPanel">
      <span style="font-size:12px; color:var(--c-text-2); font-weight:600;">кисть:</span>
      <button id="brushToggle" onclick="toggleBrush()">включить</button>
      <div class="color-swatch swatch-red" data-paint="red" onclick="pickPaint('red')"></div>
      <div class="color-swatch swatch-orange" data-paint="orange" onclick="pickPaint('orange')"></div>
      <div class="color-swatch swatch-yellow" data-paint="yellow" onclick="pickPaint('yellow')"></div>
      <div class="color-swatch swatch-green" data-paint="green" onclick="pickPaint('green')"></div>
      <div class="color-swatch swatch-blue" data-paint="blue" onclick="pickPaint('blue')"></div>
      <div class="color-swatch swatch-purple" data-paint="purple" onclick="pickPaint('purple')"></div>
      <div class="color-swatch swatch-gray" data-paint="gray" onclick="pickPaint('gray')"></div>
      <div class="color-swatch swatch-none" data-paint="none" onclick="pickPaint('none')" title="стереть"></div>
    </div>

    <div id="output"></div>

    <div id="tabsSection">
      <div class="field-group" style="margin-top:16px;">
        <input type="text" id="tabsSearch" placeholder="поиск сотрудника..." oninput="renderTabs()">
      </div>
      <div id="tabsList"></div>
    </div>

    <div id="weekProgressBlock" style="margin-top:20px;">
      <div class="panel">
        <h3 style="margin-bottom:12px;">Прогресс по сотрудникам</h3>
        <div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; margin-bottom:12px;">
          <div class="field-group" style="margin:0;"><label>Охват</label>
            <select id="wpMode" onchange="renderWeekProgress()"><option value="all">все</option><option value="filtered">по фильтрам</option></select></div>
          <div class="field-group" style="margin:0;"><label>Шаг</label>
            <select id="wpStep" onchange="renderWeekProgress()"><option value="week">неделя</option><option value="day">день</option><option value="month">месяц</option></select></div>
          <div class="field-group" style="margin:0;"><label>Метрика</label>
            <select id="wpMetric" onchange="renderWeekProgress()"><option value="pct">% ошибок</option><option value="q">качество</option></select></div>
        </div>
        <div class="chart-box"><canvas id="wpChart"></canvas></div>

}

async function doLogin() {
    if (loginInProgress) return;
    hideAuthError();
    const email = document.getElementById('authEmail').value.trim();
    const password = document.getElementById('authPassword').value;
    if (!email) { showAuthError('Введите email'); return; }
    if (!password) { showAuthError('Введите пароль'); return; }
    setAuthLoading(true);
    try {
        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) { setAuthLoading(false); showAuthError(error.message || 'Не удалось войти'); return; }
        currentUser = data.user;
        document.getElementById('authScreen').style.display = 'none';
        document.getElementById('appScreen').style.display = 'block';
        await loadUserData();
    } catch (e) {
        setAuthLoading(false);
        showAuthError('Ошибка сети: ' + e.message);
    }
}

        if (q.coef) document.getElementById('qCoefInput').value = q.coef;
        if (q.dateFrom) document.getElementById('qDateFrom').value = q.dateFrom;
        if (q.dateTo) document.getElementById('qDateTo').value = q.dateTo;
        if (q.mode) {
            const radio = document.querySelector(`input[name="qMode"][value="${q.mode}"]`);
            if (radio) radio.checked = true;
        }
        if (q.thrOrange) document.getElementById('thrOrange').value = q.thrOrange;
        if (q.thrGreen) document.getElementById('thrGreen').value = q.thrGreen;
    }
    if (settings.dynamics) {
        const d = settings.dynamics;
        if (d.step) document.getElementById('dynStep').value = d.step;
        if (d.from) document.getElementById('dynFrom').value = d.from;
        if (d.to) document.getElementById('dynTo').value = d.to;
    }
    if (settings.compare) {
        const c = settings.compare;
        if (c.target) {
            const sel = document.getElementById('cmpTarget');
            setTimeout(() => { if (sel.querySelector(`option[value="${c.target}"]`)) sel.value = c.target; }, 100);
        }
        if (c.aFrom) document.getElementById('cmpAFrom').value = c.aFrom;
        if (c.aTo) document.getElementById('cmpATo').value = c.aTo;
        if (c.bFrom) document.getElementById('cmpBFrom').value = c.bFrom;
        if (c.bTo) document.getElementById('cmpBTo').value = c.bTo;
        if (c.periodType) document.getElementById('cmpPeriodType').value = c.periodType;
        if (c.dateFrom) document.getElementById('cmpDateFrom').value = c.dateFrom;
        if (c.dateTo) document.getElementById('cmpDateTo').value = c.dateTo;
    }
    if (settings.ai) {
        const ai = settings.ai;
        if (ai.target) {
            const sel = document.getElementById('aiTarget');
            setTimeout(() => { if (sel.querySelector(`option[value="${ai.target}"]`)) sel.value = ai.target; }, 100);
        }
        if (ai.dateFrom) document.getElementById('aiDateFrom').value = ai.dateFrom;
        if (ai.dateTo) document.getElementById('aiDateTo').value = ai.dateTo;
    }
    if (settings.weekProgress) {
        const wp = settings.weekProgress;
        if (wp.mode) document.getElementById('wpMode').value = wp.mode;
        if (wp.step) document.getElementById('wpStep').value = wp.step;
        if (wp.metric) document.getElementById('wpMetric').value = wp.metric;
    }
    if (settings.managerReport) {
        const mr = settings.managerReport;
        if (mr.preset) document.getElementById('repPreset').value = mr.preset;
        if (mr.dateFrom) document.getElementById('repDateFrom').value = mr.dateFrom;
        if (mr.dateTo) document.getElementById('repDateTo').value = mr.dateTo;
        if (typeof mr.compare === 'boolean') document.getElementById('repCompare').checked = mr.compare;
        if (mr.group) document.getElementById('repGroup').value = mr.group;
        if (mr.note) document.getElementById('repManagerNote').value = mr.note;
    }
    if (settings.activeTab) {
        const tabs = document.querySelectorAll('.main-tab-btn');
        tabs.forEach(tab => {
            const onclickAttr = tab.getAttribute('onclick') || '';
            if (onclickAttr.includes(`'${settings.activeTab}'`)) switchTab(settings.activeTab, tab);
        });
    }
}

async function loadUserData() {
    if (!currentUser) return;
    const { data, error } = await supabaseClient.from('user_data').select('*').eq('id', currentUser.id).single();
    if (error && error.code !== 'PGRST116') {
        console.error('Ошибка загрузки:', error);
        showToast('Ошибка загрузки данных');
        return;
    }
    if (data) {
        userMarks = data.user_marks || {};
        userPaints = data.user_paints || {};
        userCards = data.user_cards || {};
        userVks = data.user_vks || {};
        if (data.main_data) document.getElementById('mainData').value = data.main_data;
        if (data.names_data) document.getElementById('namesData').value = data.names_data;
        if (data.main_data && data.names_data) {
            processData();
            if (data.settings) {
                applyAllSettings(data.settings);
                setTimeout(() => {
                    if (data.settings.progress) renderProgress();
                    if (data.settings.dynamics) renderDynTrainerList();
                    if (data.settings.compare) {
                        populateCompareTargets();
                        renderCompareGeneral();
                        renderCompareTable();
                    }
                    if (data.settings.ai) { populateAiTargets(); renderAiAnalysis(); }
                    if (data.settings.filters) applyFilters();
                    if (data.settings.managerReport) renderManagerReport();
                }, 150);
            }
        }
        syncQualityFromMain();
    } else {
        userMarks = {}; userPaints = {}; userCards = {}; userVks = {};
        await saveToCloud();
    }
    showToast('Данные загружены');
}

    const { data: { session } } = await supabaseClient.auth.getSession();

        currentUser = session.user;

}

function parseNames(raw) {
    const map = {};
    if (!raw || !raw.trim()) return map;
    raw.split(/\r?\n/).forEach(line => {
        const lineTrim = line.trim();
        if (!lineTrim) return;
        const parts = lineTrim.split('\t').map(s => s.trim()).filter(Boolean);
        if (parts.length === 0) return;
        let id = null; let name = null;
        const looksLikeId = (x) => /^[0-9a-fA-F]{8}-/.test(x) || /^\d{6,}$/.test(x);
        if (parts.length === 1) return;
        if (parts.length === 2) {
            if (looksLikeId(parts[1])) { id = parts[1]; name = parts[0]; }
            else if (looksLikeId(parts[0])) { id = parts[0]; name = parts[1]; }
            else { id = parts[1]; name = parts[0]; }
        } else {
            if (looksLikeId(parts[parts.length - 1])) {
                id = parts[parts.length - 1]; name = parts.slice(0, parts.length - 1).join(' ');
            } else if (looksLikeId(parts[0])) {
                id = parts[0]; name = parts.slice(1).join(' ');
            } else {
                id = parts[parts.length - 1]; name = parts.slice(0, parts.length - 1).join(' ');
            }
        }
        if (id && name) map[id] = name;
    });
    return map;
}

function processData() {
    const mainRaw = document.getElementById('mainData').value;
    const namesRaw = document.getElementById('namesData').value;
    const output = document.getElementById('output');
    if (!mainRaw.trim()) { output.innerHTML = '<p style="color:var(--c-red); text-align:center;">вставь данные в первое окно.</p>'; return; }
    const employees = parseNames(namesRaw);

    const lines = mainRaw.split(/\r?\n/);
    const parsedRows = [];
    let currentRow = [];
    let startIndex = 0;
    if (lines[0].toLowerCase().includes('marker_id')) startIndex = 1;

    for (let i = startIndex; i < lines.length; i++) {
        const cols = lines[i].split('\t');
        if (cols.length >= 5) {
            if (currentRow.length > 0) parsedRows.push(currentRow);
            currentRow = [cols[0], cols[1], cols[2], cols[3], cols.slice(4).join('\t')];
        } else if (currentRow.length > 0) {
            currentRow[4] = (currentRow[4] || '') + '\n' + lines[i];
        }
    }
    if (currentRow.length > 0) parsedRows.push(currentRow);

    const report = {};
    taskComments = {};

    parsedRows.forEach(cols => {
        const markerId = (cols[0] || '').trim();
        if (!markerId) return;
        const startDate = (cols[1] || '').trim();
        const endDate   = (cols[2] || '').trim();
        const quality   = (cols[3] || '').trim();
        const comment   = (cols[4] || '').trim();
        const qNum = parseFloat(quality.replace(',', '.'));
        if (isNaN(qNum)) return;

        const name = employees[markerId] || 'ФИО не указано';
        if (!report[markerId]) {
            report[markerId] = { id: markerId, name: name, tasks: [] };
            taskComments[markerId] = [];
        }
        const user = report[markerId];
        const startDateOnly = startDate.split('T')[0];
        const endDateOnly   = endDate.split('T')[0];

        let taskHasErrors = false;
        const taskCats = {};
        categoriesList.forEach(c => taskCats[c] = false);

        if (comment) {
            const catPattern = categoriesList.map(c => c.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|');
            const regexSplit = new RegExp(`(${catPattern})`, 'gi');
            const parts = comment.split(regexSplit);
            for (let i = 1; i < parts.length; i += 2) {
                const catName = parts[i];
                const blockText = parts[i+1] || '';
                const actualCat = categoriesList.find(c => c.toLowerCase() === catName.toLowerCase());
                if (actualCat) {
                    const cleanBlock = blockText.replace(/^[:\-\s\.]+/, '').trim();
                    if (cleanBlock.length > 0 && !cleanBlock.toLowerCase().includes('без ошибк')) {
                        taskCats[actualCat] = true;
                        taskHasErrors = true;
                        taskComments[markerId].push({
                            date: startDateOnly || endDateOnly || '',
                            taskStart: startDate,
                            category: actualCat,
                            text: cleanBlock.slice(0, 500)
                        });
                    }
                }
            }
        }

        user.tasks.push({
            startDate: startDateOnly, endDate: endDateOnly,
            startTime: startDate,
            hasErrors: taskHasErrors, cats: taskCats, quality: qNum
        });
    });

    globalReport = Object.values(report);
    populateFilters();
    populateCompareTargets();
    populateAiTargets();

    document.getElementById('filtersPanel').style.display = 'block';
    document.getElementById('marksPanel').style.display = 'flex';
    document.getElementById('exportBtn').style.display = 'inline-block';
    document.getElementById('tabsSection').style.display = 'block';

    applyFilters();
    saveToCloud();
    syncQualityFromMain();
}
    function populateFilters() {
    const userSelect = document.getElementById('filterUser');
    userSelect.innerHTML = '<option value="all">все сотрудники</option>';
    const map = new Map();
    globalReport.forEach(u => map.set(u.id, u.name));
    Array.from(map.entries()).sort((a,b)=>a[1].localeCompare(b[1]))
        .forEach(([id,name]) => {
            const opt = document.createElement('option');
            opt.value = id; opt.textContent = name;
            userSelect.appendChild(opt);
        });
}

function applyFilters() {
    if (globalReport.length === 0) return;
    const fUser     = document.getElementById('filterUser').value;
    const fDateFrom = document.getElementById('filterDateFrom').value;
    const fDateTo   = document.getElementById('filterDateTo').value;
    const fMark     = document.getElementById('filterMark').value;
    const fPaint    = document.getElementById('filterPaint').value;

    currentFilteredUsers = globalReport
        .filter(u => fUser === 'all' || u.id === fUser)
        .filter(u => {
            if (fMark === 'all') return true;
            const m = userMarks[u.id] || null;
            if (fMark === 'none') return !m;
            return m === fMark;
        })
        .filter(u => !(userCards[u.id] && userCards[u.id].archived))
        .map(user => {
            const tasksInPeriod = user.tasks.filter(t => {
                if (fDateFrom && t.endDate && t.endDate < fDateFrom) return false;
                if (fDateTo   && t.startDate && t.startDate > fDateTo) return false;
                return true;
            });
            if (tasksInPeriod.length === 0) return null;
            const newCatErrors = {};
            categoriesList.forEach(c => newCatErrors[c] = 0);
            let doneTotal = 0, doneWithErrors = 0;
            tasksInPeriod.forEach(t => {
                doneTotal++;
                if (t.hasErrors) doneWithErrors++;
                categoriesList.forEach(c => { if (t.cats[c]) newCatErrors[c]++; });
            });
            return { id: user.id, name: user.name, doneTotal, doneWithErrors, catErrors: newCatErrors };
        })
        .filter(Boolean);

    renderReport(currentFilteredUsers);
    renderTabs();
    renderWeekProgress();
}

function resetFilters() {
    document.getElementById('filterUser').value = 'all';
    document.getElementById('filterDateFrom').value = '';
    document.getElementById('filterDateTo').value = '';
    document.getElementById('filterMark').value = 'all';
    document.getElementById('filterPaint').value = 'all';
    applyFilters();
    debouncedSaveSettings();
}

function renderReport(users) {
    const container = document.getElementById('output');
    if (users.length === 0) {
        container.innerHTML = '<h3 style="text-align:center; color:var(--c-text-3); font-size:14px;">нет данных по выбранным фильтрам.</h3>';
        return;
    }
    users.sort((a,b)=>a.name.localeCompare(b.name));
    const totals = { doneTotal:0, doneWithErrors:0, catErrors:{} };
    categoriesList.forEach(c => totals.catErrors[c] = 0);
    users.forEach(u => {
        totals.doneTotal += u.doneTotal;
        totals.doneWithErrors += u.doneWithErrors;
        categoriesList.forEach(c => totals.catErrors[c] += u.catErrors[c]);
    });

    let html = `<table class="summary-table"><thead><tr>
        <th style="text-align:left; min-width:120px;">сотрудник</th>
        <th>пометка</th>
        <th>всего</th>
        <th>с ошибками</th>`;
    categoriesList.forEach(cat => {
        let sn = cat;
        if (cat.includes('грамматика')) sn = 'грамматика';
        if (cat.includes('пропущенная')) sn = 'пропущенная ё';
        if (cat.includes('контекст')) sn = 'контекст';
        if (cat.includes('ошибки РП')) sn = 'РП';
        if (cat.includes('единообразие')) sn = 'единообр.';
        if (cat.includes('комментарий')) sn = 'коммент.';
        html += `<th title="${cat}">${sn}</th>`;
    });
    html += `<th>marker_id</th></tr></thead><tbody>`;

    html += `<tr class="total-row">
        <td style="text-align:right;">ИТОГО:</td><td></td>
        <td>${totals.doneTotal}</td><td>${totals.doneWithErrors}</td>`;
    categoriesList.forEach(cat => { html += `<td>${totals.catErrors[cat]}</td>`; });
    html += `<td></td></tr>`;

    users.forEach(user => {
        const mark = userMarks[user.id] || null;
        const paintObj = userPaints[user.id] || {};
        const isOldFormat = typeof paintObj === 'string';
        const getCellPaint = (key) => {
            if (isOldFormat) return '';
            return paintObj[key] ? `paint-${paintObj[key]}` : '';
        };
        const rowClass = isOldFormat ? `paint-${paintObj}` : '';

        html += `<tr class="${rowClass}" data-user-id="${user.id}">
            <td class="name-col ${getCellPaint('name')}" onclick="event.stopPropagation(); if(brushMode){handleCellClick('${user.id}', 'name')} else {openCard('${user.id}')}">${user.name}</td>
            <td class="${getCellPaint('mark')}" onclick="handleCellClick('${user.id}', 'mark')">
                <select class="status-select" onchange="setMark('${user.id}', this.value); event.stopPropagation();">
                    <option value="" ${!mark ? 'selected' : ''}>—</option>
                    <option value="newbie" ${mark==='newbie'?'selected':''}>новичок</option>
                    <option value="experienced" ${mark==='experienced'?'selected':''}>опытный</option>
                </select>
            </td>
            <td class="${getCellPaint('doneTotal')}" onclick="handleCellClick('${user.id}', 'doneTotal')"><b>${user.doneTotal}</b></td>
            <td class="${getCellPaint('doneWithErrors')}" onclick="handleCellClick('${user.id}', 'doneWithErrors')"><b>${user.doneWithErrors}</b></td>`;

        categoriesList.forEach(cat => {
            const v = user.catErrors[cat];
            html += `<td class="${v===0?'zero-cell':''} ${getCellPaint(cat)}" onclick="handleCellClick('${user.id}', '${cat}')">${v}</td>`;
        });
        html += `<td class="id-col ${getCellPaint('id')}" onclick="handleCellClick('${user.id}', 'id')" title="${user.id}">${user.id}</td></tr>`;
    });

    html += `</tbody></table>`;
    container.innerHTML = html;
    document.querySelectorAll('.color-swatch').forEach(el => {
        el.classList.toggle('active', el.dataset.paint === brushPaint);
    });
}

function setMark(id, value) {
    if (value === '') delete userMarks[id];
    else userMarks[id] = value;
    persistAll();
    applyFilters();
}

function renderTabs() {
    const list = document.getElementById('tabsList');
    const query = document.getElementById('tabsSearch').value.toLowerCase().trim();
    if (globalReport.length === 0) { list.innerHTML = ''; return; }
    const sorted = globalReport.slice().sort((a,b)=>a.name.localeCompare(b.name));
    let html = '';
    sorted.forEach(u => {
        if (query && !u.name.toLowerCase().includes(query) && !u.id.toLowerCase().includes(query)) return;
        const isArch = userCards[u.id]?.archived;
        const cls = 'tab-btn' + (isArch ? ' archived' : '');
        const label = isArch ? `🗄 ${u.name}` : u.name;
        html += `<button class="${cls}" onclick="openCard('${u.id}')">${label}</button>`;
    });
    if (!html) html = '<p style="color:var(--c-text-3);">ничего не найдено.</p>';
    list.innerHTML = html;
}

    'систем': { topic: 'Системные ошибки', checklist: ['Уточнить критерии системных ошибок','Разобрать 3 последних случая','Согласовать правила с ревьюером'] },
    'контекст, ты/вы': { topic: 'Контекст и обращение', checklist: ['Проверить обращение к клиенту (ты/вы)','Уточнить стиль общения для каждого типа клиента','Разобрать примеры из комментариев'] },
    'комментарий': { topic: 'Качество комментариев', checklist: ['Перечитать требования к комментариям','Проверить полноту описания','Сравнить с эталонными примерами'] },
    'единообразие': { topic: 'Единообразие терминов', checklist: ['Свериться с глоссарием терминов','Проверить единообразие в рамках одной задачи','Разобрать примеры расхождений'] }
};

function getTeamAverage(excludeUserId, fromStr, toStr) {
    let total = 0, errors = 0;
    const catTotals = {};
    categoriesList.forEach(c => catTotals[c] = 0);
    globalReport.forEach(u => {
        if (u.id === excludeUserId) return;
        if (userCards[u.id]?.archived) return;
        (u.tasks || []).forEach(t => {
            const d = t.startDate || t.endDate;
            if (!d) return;
            if (fromStr && d < fromStr) return;
            if (toStr && d > toStr) return;
            total++;
            if (t.hasErrors) errors++;
            categoriesList.forEach(c => { if (t.cats[c]) catTotals[c]++; });
        });
    });
    return {
        total, errors,
        errPct: total ? (errors / total * 100) : 0,
        catPct: categoriesList.reduce((acc, c) => { acc[c] = total ? (catTotals[c] / total * 100) : 0; return acc; }, {})
    };
}

function buildRecommendations(userId, tasks, fromStr, toStr) {
    const user = globalReport.find(u => u.id === userId);
    if (!user) return null;
    const total = tasks.length;
    if (total === 0) return null;

    const errCount = tasks.filter(t => t.hasErrors).length;
    const errPct = (errCount / total) * 100;

    const catCounts = {};
    categoriesList.forEach(c => catCounts[c] = 0);
    tasks.forEach(t => categoriesList.forEach(c => { if (t.cats[c]) catCounts[c]++; }));
    const catPct = {};
    categoriesList.forEach(c => catPct[c] = (catCounts[c] / total) * 100);

    const teamAvg = getTeamAverage(userId, fromStr, toStr);

    const sorted = tasks.slice().sort((a,b) => (a.startDate||'').localeCompare(b.startDate||''));
    const mid = Math.floor(sorted.length / 2);
    const first = sorted.slice(0, mid);
    const second = sorted.slice(mid);
    const rateFirst = first.length ? first.filter(t=>t.hasErrors).length / first.length * 100 : 0;
    const rateSecond = second.length ? second.filter(t=>t.hasErrors).length / second.length * 100 : 0;
    const trendDelta = rateSecond - rateFirst;

    const catDelta = {};
    categoriesList.forEach(c => {
        const a = first.length ? first.filter(t=>t.cats[c]).length / first.length * 100 : 0;
        const b = second.length ? second.filter(t=>t.cats[c]).length / second.length * 100 : 0;
        catDelta[c] = b - a;
    });

    const problemCats = categoriesList.filter(c => catCounts[c] > 0 && catPct[c] > teamAvg.catPct[c]).sort((a,b) => catPct[b] - catPct[a]).slice(0, 3);
    const improvingCats = categoriesList.filter(c => catDelta[c] < -2).sort((a,b) => catDelta[a] - catDelta[b]).slice(0, 3);
    const worseningCats = categoriesList.filter(c => catDelta[c] > 2).sort((a,b) => catDelta[b] - catDelta[a]).slice(0, 3);

    const insights = [];
    if (trendDelta < -3) insights.push({ icon: '📈', text: `Качество растёт: за вторую половину периода % ошибок снизился на ${Math.abs(trendDelta).toFixed(1)} п.п.`, type: 'good' });
    else if (trendDelta > 3) insights.push({ icon: '📉', text: `Качество падает: за вторую половину периода % ошибок вырос на ${trendDelta.toFixed(1)} п.п.`, type: 'bad' });
    else insights.push({ icon: '➡️', text: `Стабильно: % ошибок держится примерно на одном уровне`, type: 'neutral' });

    if (problemCats.length > 0) insights.push({ icon: '⚠️', text: `Проблемная категория: ${CAT_SHORT_LABELS[problemCats[0]] || problemCats[0]} — ${catPct[problemCats[0]].toFixed(1)}% (по команде ${teamAvg.catPct[problemCats[0]].toFixed(1)}%)`, type: 'bad' });
    if (improvingCats.length > 0) insights.push({ icon: '✅', text: `Улучшение: ${CAT_SHORT_LABELS[improvingCats[0]] || improvingCats[0]} снизился на ${Math.abs(catDelta[improvingCats[0]]).toFixed(1)} п.п.`, type: 'good' });
    if (worseningCats.length > 0) insights.push({ icon: '🚨', text: `Растёт: ${CAT_SHORT_LABELS[worseningCats[0]] || worseningCats[0]} +${catDelta[worseningCats[0]].toFixed(1)} п.п.`, type: 'bad' });

    const diffWithTeam = errPct - teamAvg.errPct;
    if (Math.abs(diffWithTeam) > 1) {
        if (diffWithTeam > 0) insights.push({ icon: '📊', text: `Выше среднего по команде на ${diffWithTeam.toFixed(1)} п.п. (у вас ${errPct.toFixed(1)}%, у команды ${teamAvg.errPct.toFixed(1)}%)`, type: 'bad' });
        else insights.push({ icon: '🏆', text: `Ниже среднего по команде на ${Math.abs(diffWithTeam).toFixed(1)} п.п. (у вас ${errPct.toFixed(1)}%, у команды ${teamAvg.errPct.toFixed(1)}%)`, type: 'good' });
    }

    const vksEntries = Object.entries(userVks[userId] || {}).map(([d, e]) => ({ date: d, ...e })).filter(e => {
        if (fromStr && e.date < fromStr) return false;
        if (toStr && e.date > toStr) return false;
        return true;
    }).sort((a,b) => b.date.localeCompare(a.date));

    const lastVks = vksEntries[0];
    const daysSinceVks = lastVks ? Math.floor((new Date() - new Date(lastVks.date)) / (1000*60*60*24)) : null;
    if (daysSinceVks !== null && daysSinceVks > 30) insights.push({ icon: '⏰', text: `Последняя ВКС была ${daysSinceVks} дн. назад — пора провести`, type: 'warn' });
    else if (!lastVks) insights.push({ icon: '⏰', text: `ВКС не проводилась в выбранном периоде`, type: 'warn' });

    const vksTopics = [];
    if (problemCats.length > 0) problemCats.forEach(c => {
        const tip = CATEGORY_TIPS[c];
        if (tip) vksTopics.push({ cat: c, topic: tip.topic, count: catCounts[c] });
    });
    if (vksTopics.length === 0 && catCounts[categoriesList[0]] > 0) {
        const topCat = categoriesList.reduce((a,b) => catCounts[a] > catCounts[b] ? a : b);
        if (catCounts[topCat] > 0) {
            const tip = CATEGORY_TIPS[topCat];
            if (tip) vksTopics.push({ cat: topCat, topic: tip.topic, count: catCounts[topCat] });
        }
    }

    let vksFormat = 'общая';
    if (problemCats.length === 1 && catPct[problemCats[0]] > 20) vksFormat = 'индивидуальная';
    else if (errPct < 5 && improvingCats.length >= 2) vksFormat = 'мастер-класс';

    const checklist = [];
    problemCats.forEach(c => {
        const tip = CATEGORY_TIPS[c];
        if (tip) tip.checklist.forEach(item => checklist.push({ cat: c, text: item }));
    });
    if (checklist.length === 0 && catCounts[categoriesList[0]] > 0) checklist.push({ cat: 'общее', text: 'Продолжать в том же духе, обращать внимание на детали' });

    const praise = [];
    improvingCats.forEach(c => praise.push(`✅ ${CAT_SHORT_LABELS[c] || c}: улучшение на ${Math.abs(catDelta[c]).toFixed(1)} п.п.`));
    if (errPct < 5) praise.push(`🌟 Отличный результат: ${errPct.toFixed(1)}% ошибок — ниже 5%`);
    else if (errPct < 10) praise.push(`👍 Хороший уровень: ${errPct.toFixed(1)}% ошибок`);
    if (teamAvg.errPct > 0 && errPct < teamAvg.errPct) praise.push(`🏆 Ниже среднего по команде на ${(teamAvg.errPct - errPct).toFixed(1)} п.п.`);

    const anomalies = [];
    const weekBuckets = {};
    tasks.forEach(t => {
        const d = t.startDate || t.endDate;
        if (!d) return;
        const dt = new Date(d + 'T00:00:00');
        const day = dt.getDay() || 7;
        const mon = new Date(dt); mon.setDate(dt.getDate() - day + 1);
        const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
        const key = isoDate(mon);
        if (!weekBuckets[key]) weekBuckets[key] = { total: 0, err: 0, label: `${pad2dyn(mon.getDate())}.${pad2dyn(mon.getMonth()+1)}–${pad2dyn(sun.getDate())}.${pad2dyn(sun.getMonth()+1)}` };
        weekBuckets[key].total++;
        if (t.hasErrors) weekBuckets[key].err++;
    });
    const weekRates = Object.values(weekBuckets).map(w => w.total ? (w.err / w.total * 100) : 0);
    if (weekRates.length >= 3) {
        const mean = weekRates.reduce((a,b) => a + b, 0) / weekRates.length;
        const std = Math.sqrt(weekRates.reduce((s, r) => s + (r - mean)**2, 0) / weekRates.length);
        Object.entries(weekBuckets).forEach(([key, w]) => {
            const rate = w.total ? (w.err / w.total * 100) : 0;
            if (rate > mean + 2*std && rate > 10) anomalies.push({ label: w.label, rate, type: 'bad' });
            else if (rate < Math.max(0, mean - 2*std) && w.total >= 3 && rate < 3) anomalies.push({ label: w.label, rate, type: 'good' });
        });
    }

    const focusGoal = problemCats.length > 0
        ? `Снизить ${CAT_SHORT_LABELS[problemCats[0]] || problemCats[0]} до ${Math.max(0, catPct[problemCats[0]] * 0.5).toFixed(0)}% за 2 недели`
        : `Удерживать % ошибок ниже ${Math.max(5, errPct * 0.8).toFixed(0)}%`;

    const messageTemplate = buildMessageTemplate(user.name, errPct, teamAvg.errPct, problemCats, improvingCats, vksFormat, catCounts);

    return {
        insights, vksTopics, vksFormat, checklist, praise, anomalies, focusGoal,
        errPct, teamErrPct: teamAvg.errPct, total, errCount,
        problemCats, improvingCats, worseningCats, catPct, teamCatPct: teamAvg.catPct,
        messageTemplate
    };
}

function buildMessageTemplate(name, errPct, teamErrPct, problemCats, improvingCats, vksFormat, catCounts) {
    const firstName = name.split(' ')[0];
    let msg = `Привет, ${firstName}!\n\n`;
    if (errPct < teamErrPct) msg += `По последним задачам вижу хороший результат — ${errPct.toFixed(1)}% ошибок, это ниже среднего по команде (${teamErrPct.toFixed(1)}%). Молодец!\n\n`;
    else if (errPct > teamErrPct + 3) msg += `По последним задачам % ошибок — ${errPct.toFixed(1)}%, это чуть выше среднего по команде (${teamErrPct.toFixed(1)}%). Давай разберёмся, что можно подтянуть.\n\n`;
    else msg += `По последним задачам % ошибок — ${errPct.toFixed(1)}%, это на уровне команды (${teamErrPct.toFixed(1)}%). Стабильно!\n\n`;
    if (improvingCats.length > 0) msg += `Хорошо продвинулся по: ${improvingCats.map(c => CAT_SHORT_LABELS[c] || c).join(', ')}.\n\n`;
    if (problemCats.length > 0) {
        msg += `Предлагаю на следующей ВКС (${vksFormat}) разобрать: ${CAT_SHORT_LABELS[problemCats[0]] || problemCats[0]}`;
        if (problemCats.length > 1) msg += ` и ${problemCats.slice(1).map(c => CAT_SHORT_LABELS[c] || c).join(', ')}`;
        msg += `.\n\n`;
    }
    msg += `Если хочешь, могу скинуть примеры и чек-лист. Хорошей недели!`;
    return msg;
}

function closeModal() {

function monthTitle() {
    const months = ['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
    return `${months[calMonth]} ${calYear}`;
}
function pad2(n) { return n < 10 ? '0' + n : '' + n; }

function renderCalendar(userId) {
    const dows = ['пн','вт','ср','чт','пт','сб','вс'];
    let html = dows.map(d => `<div class="vks-dow">${d}</div>`).join('');
    const first = new Date(calYear, calMonth, 1);
    let firstDow = first.getDay();
    firstDow = (firstDow === 0) ? 6 : firstDow - 1;
    const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
    const vksForUser = userVks[userId] || {};

    for (let i = 0; i < firstDow; i++) html += `<div class="vks-day empty"></div>`;

    for (let d = 1; d <= daysInMonth; d++) {
        const key = `${calYear}-${pad2(calMonth + 1)}-${pad2(d)}`;
        const entry = vksForUser[key];
        const hasVks = !!entry;
        const cls = 'vks-day' + (hasVks ? ' has-vks' : '');
        let inner = `<div class="vks-day-num">${d}</div>`;
        if (hasVks) {
            const cat = { individual: {label:'инд.', css:'vks-cat-individual'}, general: {label:'общ.', css:'vks-cat-general'}, master: {label:'маст.', css:'vks-cat-master'} }[entry.category] || {label:entry.category, css:''};
            inner += `<div class="vks-day-cat ${cat.css}" title="${cat.label}">${cat.label}</div>`;
            if (entry.comment) inner += `<div class="vks-day-comment" title="${escapeHtml(entry.comment)}">${escapeHtml(entry.comment)}</div>`;
        }
        inner += `<div class="vks-day-plus">+</div>`;
        html += `<div class="${cls}" onclick="openVksDay('${userId}', '${key}')">${inner}</div>`;
    }
    return html;
}

function refreshCalendar() {
    const cal = document.getElementById('vksCalendar');
    const title = document.getElementById('vksMonthTitle');
    if (cal && window._currentCardUserId) cal.innerHTML = renderCalendar(window._currentCardUserId);
    if (title) title.textContent = monthTitle();
}

function changeMonth(userId, delta) {
    calMonth += delta;
    if (calMonth < 0) { calMonth = 11; calYear--; }
    if (calMonth > 11) { calMonth = 0; calYear++; }
    refreshCalendar();
}

function saveVksDay(userId, dateKey) {
    const present = document.getElementById('vksPresent').value;

function saveCard(userId) {
    if (!userCards[userId]) userCards[userId] = {};

    c.notes = document.getElementById('cardNotes').value;
    c.plan = document.getElementById('cardPlan').value;

function addLink(userId) {
    const title = document.getElementById('newLinkTitle').value.trim();

function escapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function parseVksReport() {
    const text = document.getElementById('vksReportData').value;
    const date = document.getElementById('vksImportDate').value;
    const cat = document.getElementById('vksImportCategory').value;
    if (!text.trim()) { alert('вставь данные в поле'); return; }
    if (!date) { alert('выбери дату ВКС'); return; }

    const statusEl = document.getElementById('vksImportStatus');
    const resultsEl = document.getElementById('vksImportResults');
    if (globalReport.length === 0) {
        statusEl.innerHTML = '<span style="color:var(--c-red);">❌ сначала загрузи основной отчёт на первой вкладке.</span>';
        return;
    }

    const allNames = globalReport.map(u => ({ id: u.id, fullName: u.name, firstName: u.name.split(' ')[0] }));
    const lines = text.split(/\r?\n/);
    let foundCount = 0;
    let html = `<table class="summary-table" style="white-space: normal;"><thead><tr><th>сотрудник</th><th>найденный текст</th><th>действие</th></tr></thead><tbody>`;

    lines.forEach(line => {
        if (!line.trim()) return;
        allNames.forEach(u => {
            if (line.toLowerCase().includes(u.firstName.toLowerCase())) {
                foundCount++;
                html += `<tr>
                    <td style="text-align:left;"><b>${u.fullName}</b><br><small style="color:var(--c-text-3)">${u.id}</small></td>
                    <td style="text-align:left; font-size:12px; color:var(--c-text-2); max-width:400px;">${escapeHtml(line.substring(0, 200))}${line.length > 200 ? '...' : ''}</td>
                    <td><button class="btn-load" style="padding:6px 12px; font-size:12px;" onclick="addVksFromReport('${u.id}', '${date}', '${cat}', '${escapeHtml(line.substring(0, 100))}')">➕ добавить</button></td>
                </tr>`;
            }
        });
    });

    html += '</tbody></table>';
    statusEl.innerHTML = `найдено совпадений: <b>${foundCount}</b>`;
    resultsEl.innerHTML = foundCount > 0 ? html : '<p>фамилии из справочника не найдены в этом тексте.</p>';
}

function addVksFromReport(userId, date, category, comment) {

    userVks[userId][date] = {

    };

    showToast('ВКС добавлена');

let qResultRows = []; let qAllRows = [];
let qCurrentMode = 'trainer';
let qSortKey = 'avg'; let qSortDir = 'desc';
let qSelectedEmployees = new Set(); let qAllEmployeeIds = [];

function calcQuality() {
    const coef = parseFloat(document.getElementById('qCoefInput').value.replace(',', '.')) || 1;
    qCurrentMode = document.querySelector('input[name="qMode"]:checked').value;
    const from = document.getElementById('qDateFrom').value || null;
    const to   = document.getElementById('qDateTo').value   || null;

    const dataRaw = document.getElementById('qDataInput').value;
    const nameRaw = document.getElementById('qNameInput').value;
    const lines = dataRaw.split(/\r?\n/);
    const records = [];
    let total = 0, skipped = 0;

    for (const raw of lines) {
        const line = raw.trim();
        if (line === '') continue;
        total++;
        const parts = line.includes('\t') ? line.split('\t').map(s => s.trim()) : line.split(';').map(s => s.trim());
        if (!parts || parts.length < 4) { skipped++; continue; }

        const id = parts[0]; const startRaw = parts[1]; const qualRaw = parts[3];
        const q = parseFloat(qualRaw.replace(',', '.').replace(/\s/g, ''));
        const m = startRaw.match(/^(\d{4}-\d{2}-\d{2})/); const date = m ? m[1] : null;

        if (!id || isNaN(q) || !date) { skipped++; continue; }
        if (from && date < from) { skipped++; continue; }
        if (to && date > to) { skipped++; continue; }

        records.push({ id, real: q * coef, date, original: q });
    }

    if (!records.length) { alert('не нашлось подходящих строк'); return; }
    const names = parseNames(nameRaw);

    if (qCurrentMode === 'trainer') {
        const groups = {};
        for (const r of records) {
            const key = r.id.toLowerCase().trim();
            if (!groups[key]) groups[key] = { id: r.id, sum: 0, count: 0, sumOriginal: 0 };
            groups[key].sum += r.real; groups[key].count++; groups[key].sumOriginal += r.original;
        }
        qAllRows = Object.values(groups).map(g => ({ id: g.id, name: names[g.id] || '', avg: g.sum / g.count, avgOriginal: g.sumOriginal / g.count, count: g.count }));
        document.getElementById('qResultTitle').textContent = 'среднее качество по тренерам';
        qSortKey = 'avg'; qSortDir = 'desc';
    } else if (qCurrentMode === 'day') {
        const byDay = {};
        for (const r of records) {
            if (!byDay[r.date]) byDay[r.date] = { sum: 0, count: 0, sumOriginal: 0 };
            byDay[r.date].sum += r.real; byDay[r.date].count++; byDay[r.date].sumOriginal += r.original;
        }
        qAllRows = Object.keys(byDay).map(d => ({ date: d, avg: byDay[d].sum / byDay[d].count, avgOriginal: byDay[d].sumOriginal / byDay[d].count, count: byDay[d].count }));
        document.getElementById('qResultTitle').textContent = 'среднее качество по дням';
        qSortKey = 'date'; qSortDir = 'asc';
    } else if (qCurrentMode === 'dayTrainer') {
        const groups = {};
        for (const r of records) {
            const key = r.date + '|' + r.id.toLowerCase().trim();
            if (!groups[key]) groups[key] = { date: r.date, id: r.id, sum: 0, count: 0, sumOriginal: 0 };
            groups[key].sum += r.real; groups[key].count++; groups[key].sumOriginal += r.original;
        }
        qAllRows = Object.values(groups).map(g => ({ date: g.date, id: g.id, name: names[g.id] || '', avg: g.sum / g.count, avgOriginal: g.sumOriginal / g.count, count: g.count }));
        document.getElementById('qResultTitle').textContent = 'среднее качество по дням и тренерам';
        qSortKey = 'date'; qSortDir = 'asc';
    } else if (qCurrentMode === 'week') {
        const weeks = {}; const empWeeks = {};
        for (const r of records) {
            const d = new Date(r.date);
            const day = d.getDay() || 7;
            const monday = new Date(d); monday.setDate(d.getDate() - day + 1);
            const sunday = new Date(monday); sunday.setDate(monday.getDate() + 6);
            const wKey = monday.toISOString().slice(0,10) + '_' + sunday.toISOString().slice(0,10);
            const wLabel = `${monday.getDate().toString().padStart(2,'0')}.${(monday.getMonth()+1).toString().padStart(2,'0')} - ${sunday.getDate().toString().padStart(2,'0')}.${(sunday.getMonth()+1).toString().padStart(2,'0')}`;
            weeks[wKey] = wLabel;
            const empKey = r.id.toLowerCase().trim();
            if (!empWeeks[empKey]) empWeeks[empKey] = { id: r.id, name: names[r.id] || '', weeksData: {} };
            if (!empWeeks[empKey].weeksData[wKey]) empWeeks[empKey].weeksData[wKey] = { sum: 0, count: 0 };
            empWeeks[empKey].weeksData[wKey].sum += r.real;
            empWeeks[empKey].weeksData[wKey].count++;
        }
        const sortedWeeks = Object.keys(weeks).sort();
        qAllRows = Object.values(empWeeks).map(emp => {
            const weekAvgs = {};
            for (const [wKey, data] of Object.entries(emp.weeksData)) weekAvgs[wKey] = data.sum / data.count;
            return { id: emp.id, name: emp.name, weekAvgs: weekAvgs };
        });
        document.getElementById('qResultTitle').textContent = 'сводная таблица по неделям';
        qSortKey = 'name'; qSortDir = 'asc';
        window._currentWeeksList = sortedWeeks.map(k => ({ key: k, label: weeks[k] }));
    }

    const uniqueIds = new Map();
    qAllRows.forEach(r => { if (r.id) uniqueIds.set(r.id, r.name || ''); });
    qAllEmployeeIds = Array.from(uniqueIds.keys());
    qSelectedEmployees = new Set(qAllEmployeeIds);
    renderEmployeeChips();

    applyEmployeeFilter();
    document.getElementById('qCopyBtn').disabled = false;
    document.getElementById('qResultBox').style.display = 'block';
    updateThresholdHint();

    const statsEl = document.getElementById('qStats');
    statsEl.style.display = 'block';
    statsEl.innerHTML = `строк: <b>${total}</b> · учтено: <b>${records.length}</b> · пропущено: <b>${skipped}</b>`;
}

function applyEmployeeFilter() {
    if (!qSelectedEmployees || qSelectedEmployees.size === 0) qResultRows = [];
    else qResultRows = qAllRows.filter(r => r.id ? qSelectedEmployees.has(r.id) : true);
    buildQHeader();
    applyQSort();
}

function renderEmployeeChips() {
    const container = document.getElementById('qEmpChips');
    if (!qAllEmployeeIds || qAllEmployeeIds.length === 0) return;
    const query = document.getElementById('qEmpSearch').value.toLowerCase().trim();
    const map = {}; qAllRows.forEach(r => { if (r.id) map[r.id] = r.name || ''; });
    let html = '';
    qAllEmployeeIds.slice().sort((a,b) => (map[a]||'').localeCompare(map[b]||'')).forEach(id => {
        const name = map[id] || id;
        if (query && !name.toLowerCase().includes(query) && !id.toLowerCase().includes(query)) return;
        const checked = qSelectedEmployees.has(id);
        html += `<label class="q-emp-chip ${checked ? 'checked' : ''}">
            <input type="checkbox" ${checked ? 'checked' : ''} onchange="toggleEmployee('${id.replace(/'/g,"\\'")}', this.checked)">
            ${name}
        </label>`;
    });
    if (!html) html = '<span style="font-size:12px; color:var(--c-text-3);">ничего не найдено.</span>';
    container.innerHTML = html;
}

function toggleEmployee(id, checked) {
    if (checked) qSelectedEmployees.add(id); else qSelectedEmployees.delete(id);
    renderEmployeeChips(); applyEmployeeFilter();
}

function selectAllEmployees(select) {
    if (select) qSelectedEmployees = new Set(qAllEmployeeIds); else qSelectedEmployees = new Set();
    renderEmployeeChips(); applyEmployeeFilter();
}

function updateThresholdHint() {
    const orangeStart = document.getElementById('thrOrange').value;
    const green = document.getElementById('thrGreen').value;
    document.getElementById('qThresholdHint').innerHTML =
        `🎨 цвета: <span style="color:#EF4444; font-weight:bold;">меньше ${orangeStart}</span> — красный, ` +
        `<span style="color:#F97316; font-weight:bold;">от ${orangeStart} до ${green}</span> — оранжевый, ` +
        `<span style="color:#22C55E; font-weight:bold;">от ${green} и выше</span> — зелёный.`;
}

function getQualityClass(avg) {
    const oStartVal = parseFloat(document.getElementById('thrOrange').value);
    const orangeStart = isNaN(oStartVal) ? 0.86 : oStartVal;
    const greenVal = parseFloat(document.getElementById('thrGreen').value);
    const green = isNaN(greenVal) ? 0.97 : greenVal;
    const val = Math.round(avg * 10000) / 10000;
    if (val < orangeStart) return 'q-red';
    if (val >= orangeStart && val < green) return 'q-orange';
    if (val >= green) return 'q-green';
    return '';
}

function buildQHeader() {
    let html = '<tr>';
    if (qCurrentMode === 'week') {
        html += `<th data-key="name">сотрудник <span class="arrow"></span></th>`;
        if (window._currentWeeksList) {
            window._currentWeeksList.forEach(w => { html += `<th style="text-align:center; font-size:12px;">${w.label}</th>`; });
        }
    } else {
        if (qCurrentMode !== 'trainer') html += `<th data-key="date">дата <span class="arrow"></span></th>`;
        if (qCurrentMode !== 'day')     html += `<th data-key="id">ID <span class="arrow"></span></th>`;
        if (qCurrentMode === 'trainer' || qCurrentMode === 'dayTrainer') html += `<th data-key="name">фамилия <span class="arrow"></span></th>`;
        html += `<th data-key="avg">среднее качество <span class="arrow"></span></th>`;
        html += `<th data-key="count">кол-во <span class="arrow"></span></th>`;
    }
    html += '</tr>';
    const head = document.getElementById('qResultHead');
    head.innerHTML = html;
    head.querySelectorAll('th').forEach(th => {
        th.addEventListener('click', () => {
            const key = th.dataset.key;
            if (!key || !qResultRows.length) return;
            if (qSortKey === key) qSortDir = qSortDir === 'asc' ? 'desc' : 'asc';
            else { qSortKey = key; qSortDir = (key === 'avg' || key === 'count') ? 'desc' : 'asc'; }
            applyQSort();
        });
    });
}

function applyQSort() {
    const sorted = [...qResultRows].sort((a, b) => {
        let va = a[qSortKey], vb = b[qSortKey];
        if (qSortKey === 'name') { va = va || 'яяя'; vb = vb || 'яяя'; }
        let cmp;
        if (typeof va === 'number' && typeof vb === 'number') cmp = va - vb;
        else cmp = String(va).localeCompare(String(vb), 'ru');
        return qSortDir === 'asc' ? cmp : -cmp;
    });
    renderQTable(sorted);
    document.querySelectorAll('#qResultHead th').forEach(th => {
        const arrow = th.querySelector('.arrow');
        if (arrow) arrow.textContent = (th.dataset.key === qSortKey) ? (qSortDir === 'asc' ? '▲' : '▼') : '';
    });
}

function renderQTable(rows) {
    const tbody = document.querySelector('#qResultTable tbody');
    tbody.innerHTML = '';
    if (qCurrentMode === 'week') {
        rows.forEach(r => {
            const tr = document.createElement('tr');
            let cells = `<td><b>${r.name || '— нет —'}</b></td>`;
            if (window._currentWeeksList) {
                window._currentWeeksList.forEach(w => {
                    const val = r.weekAvgs[w.key];
                    if (val !== undefined) {
                        const qClass = getQualityClass(val);
                        cells += `<td class="${qClass}" style="text-align:center;">${val.toFixed(3)}</td>`;
                    } else {
                        cells += `<td style="text-align:center; color:#CCC;">—</td>`;
                    }
                });
            }
            tr.innerHTML = cells;
            tbody.appendChild(tr);
        });
        return;
    }
    rows.forEach(r => {
        const tr = document.createElement('tr');
        let cells = '';
        if (qCurrentMode !== 'trainer') cells += `<td>${r.date}</td>`;
        if (qCurrentMode !== 'day')     cells += `<td>${r.id}</td>`;
        if (qCurrentMode === 'trainer' || qCurrentMode === 'dayTrainer') {
            cells += r.name ? `<td>${r.name}</td>` : `<td class="no-name">— нет —</td>`;
        }
        const qClass = getQualityClass(r.avg);
        const originalAvg = r.avgOriginal ? r.avgOriginal.toFixed(4) : '';
        const origSpan = originalAvg ? ` <span style="font-size:11px; color:var(--c-text-3); font-weight:normal;">(из ${originalAvg})</span>` : '';
        cells += `<td class="${qClass}" title="системная оценка: ${originalAvg}">${r.avg.toFixed(4)}${origSpan}</td><td>${r.count}</td>`;
        tr.innerHTML = cells;
        tbody.appendChild(tr);
    });
}

function copyQualityResult() {
    if (!qResultRows.length) return;
    let header = [];
    if (qCurrentMode !== 'trainer') header.push('дата');
    if (qCurrentMode !== 'day') header.push('ID');
    if (qCurrentMode === 'trainer' || qCurrentMode === 'dayTrainer') header.push('фамилия');
    if (qCurrentMode === 'week') {
        header.push('сотрудник');
        window._currentWeeksList.forEach(w => header.push(w.label));
    } else {
        header.push('среднее_качество', 'кол-во');
    }
    const lines = [header.join('\t')];
    qResultRows.forEach(r => {
        const row = [];
        if (qCurrentMode === 'week') {
            row.push(r.name || '');
            window._currentWeeksList.forEach(w => {
                const val = r.weekAvgs[w.key];
                row.push(val !== undefined ? val.toFixed(4) : '');
            });
        } else {
            if (qCurrentMode !== 'trainer') row.push(r.date);
            if (qCurrentMode !== 'day') row.push(r.id);
            if (qCurrentMode === 'trainer' || qCurrentMode === 'dayTrainer') row.push(r.name);
            row.push(r.avg.toFixed(4), r.count);
        }
        lines.push(row.join('\t'));
    });
    navigator.clipboard.writeText(lines.join('\n')).then(() => {
        showToast('скопировано');
        const btn = document.getElementById('qCopyBtn');
        btn.textContent = 'скопировано ✓';
        setTimeout(() => btn.textContent = 'скопировать', 1500);
    });
}

let progChart = null;
function pad2p(n) { return n < 10 ? '0' + n : '' + n; }
function isoDateP(d) { return d.getFullYear() + '-' + pad2p(d.getMonth()+1) + '-' + pad2p(d.getDate()); }

function applyProgQuick(val) {
    const fromEl = document.getElementById('progFrom');
    const toEl = document.getElementById('progTo');
    const today = new Date();
    if (val === '' || val === 'all') { fromEl.value=''; toEl.value=''; renderProgress(); return; }
    const weeks = parseInt(val);
    const from = new Date(today);
    from.setDate(from.getDate() - weeks * 7);
    fromEl.value = isoDateP(from);
    toEl.value = isoDateP(today);
    renderProgress();
    debouncedSaveSettings();
}

function progBucketKey(dateStr, step) {
    const d = new Date(dateStr + 'T00:00:00');
    if (step === 'day') return dateStr;
    if (step === 'month') return dateStr.slice(0,7);
    const day = d.getDay() || 7;
    const mon = new Date(d); mon.setDate(d.getDate() - day + 1);
    return isoDateP(mon);
}
function progBucketLabel(key, step) {
    if (step === 'day') { const [y,m,dd] = key.split('-'); return dd + '.' + m; }
    if (step === 'month') {
        const [y,m] = key.split('-');
        const months = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
        return months[parseInt(m)-1] + ' ' + y.slice(2);
    }
    const [y,m,dd] = key.split('-');
    const d = new Date(key + 'T00:00:00');
    const sun = new Date(d); sun.setDate(d.getDate() + 6);
    return `${dd}.${m}–${pad2p(sun.getDate())}.${pad2p(sun.getMonth()+1)}`;
}

function renderProgress() {
    const norm = parseFloat(document.getElementById('progNorm').value) || 0;
    const step = document.getElementById('progStep').value;
    const group = document.getElementById('progGroup').value;
    const fromStr = document.getElementById('progFrom').value || null;
    const toStr = document.getElementById('progTo').value || null;

    const filteredUsers = globalReport.filter(u => {
        if (userCards[u.id]?.archived) return false;
        const m = userMarks[u.id];
        if (group === 'newbie' && m !== 'newbie') return false;
        if (group === 'experienced' && m !== 'experienced') return false;
        return true;
    });

    const buckets = {};
    let grandTotal = 0, grandQualitySum = 0;

    filteredUsers.forEach(u => {
        (u.tasks || []).forEach(t => {
            const d = t.startDate || t.endDate;
            if (!d) return;
            if (fromStr && d < fromStr) return;
            if (toStr && d > toStr) return;
            const k = progBucketKey(d, step);
            if (!buckets[k]) buckets[k] = { total: 0, qualitySum: 0 };
            const q = (t.quality !== undefined && !isNaN(t.quality)) ? t.quality : 0;
            buckets[k].total++;
            buckets[k].qualitySum += q;
            grandTotal++;
            grandQualitySum += q;
        });
    });

    const keys = Object.keys(buckets).sort();
    const labels = keys.map(k => progBucketLabel(k, step));
    const dataQuality = keys.map(k => {
        const b = buckets[k];
        return b.total ? +((b.qualitySum / b.total) * 100).toFixed(2) : 0;
    });
    const dataNorm = keys.map(() => norm);

    const currentQuality = grandTotal ? ((grandQualitySum / grandTotal) * 100) : 0;
    const diff = currentQuality - norm;
    const status = diff >= 0 ? 'good' : diff >= -5 ? 'warn' : 'bad';
    const statusLabel = diff >= 0 ? 'в норме' : diff >= -5 ? 'близко к норме' : 'ниже нормы';

    const firstVal = dataQuality[0] ?? 0;
    const lastVal = dataQuality[dataQuality.length - 1] ?? 0;
    const trend = lastVal - firstVal;
    const trendLabel = trend > 0.5 ? '↑ улучшение' : trend < -0.5 ? '↓ ухудшение' : '→ стабильно';
    const trendColor = trend > 0.5 ? 'var(--c-green)' : trend < -0.5 ? 'var(--c-red)' : 'var(--c-text-3)';

    const kpiEl = document.getElementById('progKpi');
    kpiEl.innerHTML = `
        <div class="progress-kpi" style="border-left-color:var(--c-primary);">
            <div class="lbl">Среднее качество</div>
            <div class="val">${currentQuality.toFixed(2)}<small>%</small></div>
            <div class="sub">${grandTotal} задач</div>
        </div>
        <div class="progress-kpi" style="border-left-color:var(--c-text-3);">
            <div class="lbl">Норма качества</div>
            <div class="val">${norm.toFixed(1)}<small>%</small></div>
            <div class="sub">задаётся вручную</div>
        </div>
        <div class="progress-kpi" style="border-left-color:${status === 'good' ? 'var(--c-green)' : status === 'warn' ? 'var(--c-orange)' : 'var(--c-red)'};">
            <div class="lbl">${diff >= 0 ? 'Профицит' : 'Недостаёт'}</div>
            <div class="val" style="color:${status === 'good' ? 'var(--c-green)' : status === 'warn' ? 'var(--c-orange)' : 'var(--c-red)'};">
                ${diff >= 0 ? '+' : ''}${diff.toFixed(2)}<small>п.п.</small>
            </div>
            <div class="sub">${statusLabel}</div>
        </div>
        <div class="progress-kpi" style="border-left-color:${trendColor};">
            <div class="lbl">Тренд за период</div>
            <div class="val" style="color:${trendColor};">${trendLabel}</div>
            <div class="sub">${trend > 0 ? '+' : ''}${trend.toFixed(2)} п.п.</div>
        </div>
    `;

    if (progChart) progChart.destroy();
    const ctx = document.getElementById('progChart').getContext('2d');
    progChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels,
            datasets: [
                { label: 'Среднее качество команды', data: dataQuality, borderColor: '#5B9DF9', backgroundColor: 'rgba(91,157,249,0.15)', fill: 'origin', tension: 0.35, pointRadius: 4, pointHoverRadius: 7, pointBackgroundColor: '#5B9DF9', pointBorderColor: '#FFFFFF', pointBorderWidth: 2, borderWidth: 3 },
                { label: `Норма (${norm.toFixed(1)}%)`, data: dataNorm, borderColor: '#FF3B30', backgroundColor: 'rgba(255,59,48,0.10)', fill: 'origin', tension: 0, pointRadius: 0, pointHoverRadius: 0, borderWidth: 2, borderDash: [6, 4] }
            ]
        },
        options: {
            responsive: true, maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            plugins: {
                legend: { position: 'top', labels: { font: { family: 'Inter', size: 12 }, usePointStyle: true, padding: 16 } },
                tooltip: { backgroundColor: '#1C1C1E', padding: 12, cornerRadius: 8, titleFont: { family: 'Inter' }, bodyFont: { family: 'Inter' }, callbacks: { label: c => `${c.dataset.label}: ${c.parsed.y.toFixed(2)}%` } }
            },
            scales: {
                y: { beginAtZero: false, min: 0, max: 100, title: { display: true, text: '% качества', font: { family: 'Inter' } }, ticks: { callback: v => v + '%', font: { family: 'Inter' } }, grid: { color: 'rgba(0,0,0,0.05)' } },
                x: { grid: { display: false }, ticks: { font: { family: 'Inter' }, maxRotation: 45, minRotation: 0 } }
            }
        }
    });

    const tableEl = document.getElementById('progTable');
    if (keys.length === 0) { tableEl.innerHTML = '<p style="color:var(--c-text-3); font-size:13px; padding:10px;">нет данных в выбранном периоде.</p>'; return; }
    let html = `<table class="progress-table"><thead><tr><th>период</th><th>задач</th><th>среднее качество</th><th>норма</th><th>Δ</th><th>статус</th></tr></thead><tbody>`;
    keys.forEach(k => {
        const b = buckets[k];
        const q = b.total ? ((b.qualitySum / b.total) * 100) : 0;
        const d = q - norm;
        const st = d >= 0 ? 'good' : d >= -5 ? 'warn' : 'bad';
        const stLabel = d >= 0 ? '✓ в норме' : d >= -5 ? '⚠ близко' : '✗ ниже';
        html += `<tr>
            <td class="period-col">${progBucketLabel(k, step)}</td>
            <td>${b.total}</td>
            <td><b>${q.toFixed(2)}%</b></td>
            <td>${norm.toFixed(1)}%</td>
            <td style="color:${st === 'good' ? 'var(--c-green)' : st === 'warn' ? 'var(--c-orange)' : 'var(--c-red)'}; font-weight:600;">${d > 0 ? '+' : ''}${d.toFixed(2)}</td>
            <td><span class="badge badge-status badge-${st}">${stLabel}</span></td>
        </tr>`;
    });
    html += `</tbody></table>`;
    tableEl.innerHTML = html;
}

    const toStr = document.getElementById('progTo').value || null;
    const filteredUsers = globalReport.filter(u => {
        if (userCards[u.id]?.archived) return false;
        const m = userMarks[u.id];
        if (group === 'newbie' && m !== 'newbie') return false;
        if (group === 'experienced' && m !== 'experienced') return false;
        return true;
    });
    const buckets = {};
    filteredUsers.forEach(u => {
        (u.tasks || []).forEach(t => {
            const d = t.startDate || t.endDate;
            if (!d) return;
            if (fromStr && d < fromStr) return;
            if (toStr && d > toStr) return;
            const k = progBucketKey(d, step);
            if (!buckets[k]) buckets[k] = { total: 0, qualitySum: 0 };
            const q = (t.quality !== undefined && !isNaN(t.quality)) ? t.quality : 0;
            buckets[k].total++; buckets[k].qualitySum += q;
        });
    });
    const wb = XLSX.utils.book_new();
    const head = ['период', 'задач', 'среднее качество', 'норма', 'Δ'];
