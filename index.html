function getTrendInfo(tasksSorted) {
    if (tasksSorted.length < 2) return { trend: 'flat', delta: 0 };
    const mid = Math.floor(tasksSorted.length / 2);
    const firstHalf = tasksSorted.slice(0, mid);
    const secondHalf = tasksSorted.slice(mid);
    const rate = arr => arr.length ? arr.filter(t => t.hasErrors).length / arr.length : 0;
    const firstRate = rate(firstHalf);
    const secondRate = rate(secondHalf);
    const delta = secondRate - firstRate;
    let trend = 'flat';
    if (delta < -0.03) trend = 'up';
    else if (delta > 0.03) trend = 'down';
    return { trend, delta };
}

function renderDynKpi(user, tasks, step, fromStr, toStr) {
    const sorted = tasks.slice().sort((a,b) => (a.startDate||'').localeCompare(b.startDate||''));
    const total = sorted.length;
    const withErr = sorted.filter(t => t.hasErrors).length;
    const errPct = total ? (withErr / total * 100) : 0;
    const trend = getTrendInfo(sorted);
    const trendIcon = trend.trend === 'up' ? '📈' : trend.trend === 'down' ? '📉' : '➡️';
    const trendLabel = trend.trend === 'up' ? 'качество растёт' : trend.trend === 'down' ? 'качество падает' : 'стабильно';
    const deltaPct = (trend.delta * 100);
    const deltaSign = deltaPct > 0 ? '+' : '';
    const deltaColor = deltaPct < 0 ? 'var(--c-green)' : deltaPct > 0 ? 'var(--c-red)' : 'var(--c-text-3)';
    const borderColor = trend.trend === 'up' ? 'var(--c-green)' : trend.trend === 'down' ? 'var(--c-red)' : 'var(--c-text-3)';

    const html = `

function renderDynQualityChart(user, tasks, step) {
    const bucketsUser = {};
    const bucketsAll = {};
    tasks.forEach(t => {
        const d = t.startDate || t.endDate;
        if (!d) return;
        const k = dynBucketKey(d, step);
        if (!bucketsUser[k]) bucketsUser[k] = { total: 0, err: 0 };
        bucketsUser[k].total++;
        if (t.hasErrors) bucketsUser[k].err++;
    });
    const fromStr = document.getElementById('dynFrom').value || null;
    const toStr = document.getElementById('dynTo').value || null;
    globalReport.forEach(u => {
        if (userCards[u.id]?.archived) return;
        (u.tasks || []).forEach(t => {
            const d = t.startDate || t.endDate;
            if (!d) return;
            if (fromStr && d < fromStr) return;
            if (toStr && d > toStr) return;
            const k = dynBucketKey(d, step);
            if (!bucketsAll[k]) bucketsAll[k] = { total: 0, err: 0 };
            bucketsAll[k].total++;
            if (t.hasErrors) bucketsAll[k].err++;
        });
    });

    const allKeys = Array.from(new Set([...Object.keys(bucketsUser), ...Object.keys(bucketsAll)])).sort();
    const labels = allKeys.map(k => dynBucketLabel(k, step));
    const dataUser = allKeys.map(k => {
        const b = bucketsUser[k];
        return b && b.total ? +(b.err / b.total * 100).toFixed(1) : null;
    });
    const dataAll = allKeys.map(k => {
        const b = bucketsAll[k];
        return b && b.total ? +(b.err / b.total * 100).toFixed(1) : null;
    });

    if (dynChartQuality) dynChartQuality.destroy();
    const ctx = document.getElementById('dynChartQuality').getContext('2d');
    dynChartQuality = new Chart(ctx, {
        type: 'line',
        data: {
            labels,
            datasets: [
                { label: 'тренер (% ошибок)', data: dataUser, borderColor: '#5B9DF9', backgroundColor: 'rgba(91,157,249,0.15)', fill: 'origin', tension: 0.3, spanGaps: true, pointRadius: 4, pointHoverRadius: 6, borderWidth: 2.5 },
                { label: 'среднее по всем', data: dataAll, borderColor: '#A0A0A8', backgroundColor: 'rgba(160,160,168,0.10)', fill: 'origin', tension: 0.3, spanGaps: true, pointRadius: 2, borderDash: [6,4], borderWidth: 2 }
            ]
        },
        options: {
            responsive: true, maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            plugins: {
                legend: { position: 'top', labels: { font: { family: 'Inter', size: 12 }, usePointStyle: true, padding: 16 } },
                tooltip: { callbacks: { label: c => c.dataset.label + ': ' + c.parsed.y + '%' }, backgroundColor: '#1C1C1E', titleFont: { family: 'Inter' }, bodyFont: { family: 'Inter' }, padding: 12, cornerRadius: 8 }

                x: { grid: { display: false }, ticks: { font: { family: 'Inter' } } }

    });
}

function renderDynCatsChart(user, tasks, step) {

function renderDynProgressTable(user, tasks, step) {
    if (tasks.length === 0) {
        document.getElementById('dynProgressTable').innerHTML = '<p style="color:var(--c-text-3); font-size:13px; padding:10px;">нет задач в выбранном периоде.</p>';
        return;
    }
    const buckets = {};
    tasks.forEach(t => {
        const d = t.startDate || t.endDate;
        if (!d) return;
        const k = dynBucketKey(d, step);
        if (!buckets[k]) { buckets[k] = { total: 0, err: 0, cats: {} }; categoriesList.forEach(c => buckets[k].cats[c] = 0); }
        buckets[k].total++;
        if (t.hasErrors) buckets[k].err++;
        categoriesList.forEach(c => { if (t.cats[c]) buckets[k].cats[c]++; });
    });
    const keys = Object.keys(buckets).sort();
    if (keys.length === 0) {
        document.getElementById('dynProgressTable').innerHTML = '<p style="color:var(--c-text-3); font-size:13px; padding:10px;">нет данных.</p>';
        return;
    }

    let html = `<table class="progress-table" style="min-width:700px;"><thead><tr>
        <th style="text-align:left; position:sticky; left:0; background:var(--c-surface-2); z-index:3;">период</th>
        <th>задач</th>
        <th>с ошиб.</th>
        <th>% ошибок</th>`;
    categoriesList.forEach(cat => { html += `<th title="${cat}" style="font-size:10px;">${(CAT_SHORT_LABELS[cat] || cat).slice(0, 10)}</th>`; });
    html += `</tr></thead><tbody>`;

    keys.forEach(k => {
        const b = buckets[k];
        const errPct = b.total ? (b.err / b.total * 100) : 0;
        let rowBg = '';
        if (errPct > 10) rowBg = 'background:#FEF2F2;';
        else if (errPct > 5) rowBg = 'background:#FFFBEB;';
        else rowBg = 'background:#F0FDF4;';
        html += `<tr style="${rowBg}">
            <td class="period-col"><b>${dynBucketLabel(k, step)}</b></td>
            <td>${b.total}</td>
            <td>${b.err}</td>
            <td><b>${errPct.toFixed(1)}%</b></td>`;
        categoriesList.forEach(cat => {
            const v = b.cats[cat];
            html += `<td style="${v === 0 ? 'color:#CBD5E1;' : 'color:var(--c-red); font-weight:600;'}">${v}</td>`;
        });
        html += `</tr>`;
    });

    if (keys.length >= 2) {
        const firstKey = keys[0];
        const lastKey  = keys[keys.length - 1];
        const f = buckets[firstKey];
        const l = buckets[lastKey];
        const fPct = f.total ? (f.err / f.total * 100) : 0;
        const lPct = l.total ? (l.err / l.total * 100) : 0;
        const deltaPct = lPct - fPct;

        html += `<tr style="background:var(--c-primary-soft); border-top:2px solid var(--c-primary); font-weight:700;">
            <td class="period-col" style="background:var(--c-primary-soft); position:sticky; left:0; z-index:2;">Δ ${dynBucketLabel(firstKey,step)} → ${dynBucketLabel(lastKey,step)}</td>
            <td>${l.total - f.total >= 0 ? '+' : ''}${l.total - f.total}</td>
            <td>${l.err - f.err >= 0 ? '+' : ''}${l.err - f.err}</td>
            <td style="color:${deltaPct < -1 ? 'var(--c-green)' : deltaPct > 1 ? 'var(--c-red)' : 'var(--c-text-2)'};">
                ${deltaPct > 0 ? '+' : ''}${deltaPct.toFixed(1)} п.п.
            </td>`;
        categoriesList.forEach(cat => {
            const delta = l.cats[cat] - f.cats[cat];
            const color = delta < 0 ? 'var(--c-green)' : delta > 0 ? 'var(--c-red)' : 'var(--c-text-3)';
            const sign = delta > 0 ? '+' : '';
            html += `<td style="color:${color};">${sign}${delta}</td>`;
        });
        html += `</tr>`;
    }
    html += `</tbody></table>`;
    document.getElementById('dynProgressTable').innerHTML = html;
}

function importPreviousXlsx(ev) {
    const file = ev.target.files[0];
    if (!file) return;
    const statusEl = document.getElementById('importStatus');
    statusEl.textContent = 'читаю файл...';

    const reader = new FileReader();
    reader.onload = e => {
        try {
            const data = new Uint8Array(e.target.result);
            const wb = XLSX.read(data, { type: 'array' });
            const sheetName = wb.SheetNames.find(n => n.toLowerCase().includes('карточ'));
            if (!sheetName) { statusEl.innerHTML = '<span style="color:var(--c-red);">❌ не найден лист «карточки».</span>'; return; }

            const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { defval: '' });
            const map = {};
            rows.forEach(r => {
                const id = String(r['marker_id'] || '').trim();
                if (id) map[id] = r;
            });

            const foundInCurrent = globalReport.filter(u => map[u.id]).length;
            if (foundInCurrent === 0) {
                statusEl.innerHTML = `<span style="color:var(--c-orange-text);">⚠️ файл прочитан, но ни один marker_id не совпал.</span>`;
                return;
            }

            const overwrite = confirm(`найдено ${foundInCurrent} совпадений.\nOK — перезаписать, Отмена — заполнить только пустые.`);

            let vksMap = {};
            const vksSheetName = wb.SheetNames.find(n => n.toLowerCase().includes('вкс'));
            if (vksSheetName) {
                XLSX.utils.sheet_to_json(wb.Sheets[vksSheetName], { defval: '' }).forEach(r => {
                    const id = String(r['marker_id'] || '').trim();
                    const date = String(r['дата'] || r['Дата'] || '').trim();
                    if (!id || !date) return;
                    if (!vksMap[id]) vksMap[id] = {};
                    const catLabel = String(r['категория'] || r['Категория'] || '').toLowerCase();
                    let catKey = 'individual';
                    if (catLabel.includes('общ')) catKey = 'general';
                    else if (catLabel.includes('мастер')) catKey = 'master';
                    vksMap[id][date] = { category: catKey, comment: String(r['комментарий'] || r['Комментарий'] || '').trim() };
                });
            }

            let updated = 0;
            globalReport.forEach(u => {
                const r = map[u.id];
                if (!r) return;
                updated++;

                const markRaw = String(r['пометка'] || r['Пометка'] || '').trim().toLowerCase();
                let newMark = null;
                if (markRaw.includes('нович')) newMark = 'newbie';
                else if (markRaw.includes('опытн')) newMark = 'experienced';

                const paintRaw = String(r['цвет'] || r['Цвет'] || '').trim().toLowerCase();
                let newPaint = null;
                const paintMap = {'красн':'red','оранж':'orange','жёлт':'yellow','зелён':'green','синий':'blue','фиолет':'purple','серый':'gray'};
                for (const k in paintMap) if (paintRaw.includes(k)) newPaint = paintMap[k];

                if (!userCards[u.id]) userCards[u.id] = {};
                const card = userCards[u.id];
                const setField = (key, val) => { if (overwrite || !card[key]) card[key] = val; };
                setField('hireDate', String(r['дата выхода'] || r['Дата выхода'] || '').trim());
                setField('mentor', String(r['валидатор'] || r['Валидатор'] || r['Наставник'] || '').trim());
                setField('notes', String(r['заметки'] || r['Заметки'] || '').trim());
                setField('plan', String(r['план развития'] || r['План развития'] || '').trim());

                const linksRaw = String(r['ссылки'] || r['Ссылки'] || '').trim();
                if (linksRaw && (overwrite || !card.links || card.links.length === 0)) {
                    const links = [];
                    linksRaw.split(/\r?\n/).forEach(line => {
                        const m = line.match(/^(.*?):\s*(https?:\/\/\S+)/);
                        if (m) links.push({ title: m[1].trim() || m[2], url: m[2].trim() });
                    });
                    card.links = links;
                }

                const archRaw = String(r['архив'] || r['Архив'] || '').trim().toLowerCase();
                if (archRaw === 'да' || archRaw === 'yes' || archRaw === 'true') card.archived = true;
                else if (archRaw === '') card.archived = card.archived || false;

                if (newMark !== null) { if (overwrite || !userMarks[u.id]) userMarks[u.id] = newMark; }
                if (newPaint !== null) { if (overwrite || !userPaints[u.id]) userPaints[u.id] = newPaint; }

                if (vksMap[u.id]) {
                    if (overwrite || !userVks[u.id]) userVks[u.id] = vksMap[u.id];
                    else Object.assign(userVks[u.id], vksMap[u.id]);
                }
            });

            persistAll();
            statusEl.innerHTML = `<span style="color:var(--c-green);">✅ загружено ${updated} сотрудников.</span>`;
            applyFilters();
            showToast('прошлый отчёт подтянут');
        } catch (err) {
            statusEl.innerHTML = `<span style="color:var(--c-red);">❌ ошибка: ${err.message}</span>`;
        }
    };
    reader.readAsArrayBuffer(file);
    ev.target.value = '';
}

let wpChart = null;

function wpBucketKey(dateStr, step) {
    const d = new Date(dateStr + 'T00:00:00');
    if (step === 'day') return dateStr;
    if (step === 'month') return dateStr.slice(0,7);
    const day = d.getDay() || 7;
    const mon = new Date(d); mon.setDate(d.getDate() - day + 1);
    return isoDateP(mon);
}
function wpBucketLabel(key, step) {
    if (step === 'day') { const [y,m,dd] = key.split('-'); return dd + '.' + m; }
    if (step === 'month') {
        const [y,m] = key.split('-');
        const months = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
        return months[parseInt(m)-1] + ' ' + y.slice(2);
    }
    const [y,m,dd] = key.split('-');
    const d = new Date(key + 'T00:00:00');
    const sun = new Date(d); sun.setDate(d.getDate() + 6);
    return `${dd}.${m}–${pad2p(sun.getDate())}.${pad2p(sun.getMonth()+1)}`;
}

function renderWeekProgress() {
    const block = document.getElementById('weekProgressBlock');
    if (!block) return;
    const mode = document.getElementById('wpMode').value;
    const step = document.getElementById('wpStep').value;
    const metric = document.getElementById('wpMetric').value;

    let usersList = [];
    if (mode === 'all') {
        usersList = globalReport.filter(u => !(userCards[u.id] && userCards[u.id].archived));
    } else {
        if (!currentFilteredUsers || currentFilteredUsers.length === 0) { block.style.display = 'none'; return; }
        usersList = currentFilteredUsers.map(u => globalReport.find(x => x.id === u.id)).filter(Boolean);
    }
    if (!usersList || usersList.length === 0) { block.style.display = 'none'; return; }
    block.style.display = 'block';

    const fDateFrom = document.getElementById('filterDateFrom').value || null;
    const fDateTo   = document.getElementById('filterDateTo').value || null;

    const userBuckets = {};
    const allBuckets = new Set();

    usersList.forEach(u => {
        userBuckets[u.id] = { name: u.name, buckets: {} };
        (u.tasks || []).forEach(t => {
            const d = t.startDate || t.endDate;
            if (!d) return;
            if (fDateFrom && d < fDateFrom) return;
            if (fDateTo && d > fDateTo) return;
            const k = wpBucketKey(d, step);
            allBuckets.add(k);
            if (!userBuckets[u.id].buckets[k]) userBuckets[u.id].buckets[k] = { total: 0, err: 0, qSum: 0 };
            userBuckets[u.id].buckets[k].total++;
            if (t.hasErrors) userBuckets[u.id].buckets[k].err++;
            const q = (t.quality !== undefined && !isNaN(t.quality)) ? t.quality : 0;
            userBuckets[u.id].buckets[k].qSum += q;
        });
    });

    const keys = Array.from(allBuckets).sort();
    const labels = keys.map(k => wpBucketLabel(k, step));

    const cellValue = (b) => {
        if (!b || b.total === 0) return null;
        if (metric === 'pct') return (b.err / b.total) * 100;
        return (b.qSum / b.total) * 100;
    };

    if (wpChart) wpChart.destroy();
    const palette = ['#5B9DF9','#FF9500','#34C759','#FF3B30','#7B6FE8','#00C7BE','#AF52DE','#FFCC00','#FF6B6B','#69DB7C'];
    const sortedUsers = Object.values(userBuckets).sort((a,b)=>a.name.localeCompare(b.name));
    const datasets = sortedUsers.map((u, i) => ({
        label: u.name,
        data: keys.map(k => {
            const v = cellValue(u.buckets[k]);
            return v === null ? null : +v.toFixed(2);
        }),
        borderColor: palette[i % palette.length],
        backgroundColor: palette[i % palette.length] + '22',
        tension: 0.3, spanGaps: true, pointRadius: 3, pointHoverRadius: 6, borderWidth: 2
    }));

    const ctx = document.getElementById('wpChart').getContext('2d');
    wpChart = new Chart(ctx, {
        type: 'line',
        data: { labels, datasets },
        options: {
            responsive: true, maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            plugins: {
                legend: { position: 'top', labels: { font: { family: 'Inter', size: 11 }, usePointStyle: true, padding: 10, boxWidth: 10 } },
                tooltip: { backgroundColor: '#1C1C1E', padding: 10, cornerRadius: 8, callbacks: { label: c => `${c.dataset.label}: ${c.parsed.y === null ? '—' : c.parsed.y.toFixed(1) + '%'}` } }
            },
            scales: {
                y: { beginAtZero: metric === 'pct', max: metric === 'pct' ? undefined : 100, title: { display: true, text: metric === 'pct' ? '% ошибок' : '% качества' }, ticks: { callback: v => v + '%' }, grid: { color: 'rgba(0,0,0,0.05)' } },
                x: { grid: { display: false } }
            }
        }
    });

    const pctClass = (v) => {
        if (v === null) return '';
        if (v <= 5) return 'background:#D4EDDA; color:#155724; font-weight:600;';
        if (v <= 15) return 'background:#FFF3CD; color:#856404; font-weight:600;';
        return 'background:#F8D7DA; color:#721C24; font-weight:600;';
    };
    const qualityClass = (v) => {
        if (v === null) return '';
        const green = parseFloat(document.getElementById('thrGreen').value) || 0.97;
        const orange = parseFloat(document.getElementById('thrOrange').value) || 0.86;
        const val = v / 100;
        if (val >= green) return 'background:#D4EDDA; color:#155724; font-weight:600;';
        if (val >= orange) return 'background:#FFF3CD; color:#856404; font-weight:600;';
        return 'background:#F8D7DA; color:#721C24; font-weight:600;';
    };

    let html = `<table class="progress-table" style="min-width:${600 + keys.length * 70}px;"><thead><tr><th style="text-align:left; position:sticky; left:0; background:var(--c-surface-2); z-index:3;">сотрудник</th>`;
    keys.forEach(k => { html += `<th style="font-size:11px;">${wpBucketLabel(k, step)}</th>`; });
    html += `<th>тренд</th></tr></thead><tbody>`;

    sortedUsers.forEach(u => {
        html += `<tr><td class="period-col" style="position:sticky; left:0; background:var(--c-surface); z-index:2;"><b>${u.name}</b></td>`;
        let firstVal = null, lastVal = null;
        keys.forEach(k => {
            const v = cellValue(u.buckets[k]);
            const style = v === null ? 'color:#CCC;' : (metric === 'pct' ? pctClass(v) : qualityClass(v));
            if (v !== null) { if (firstVal === null) firstVal = v; lastVal = v; }
            html += `<td style="${style}">${v === null ? '—' : v.toFixed(1)}</td>`;
        });
        let trendHtml = '—';
        if (firstVal !== null && lastVal !== null && keys.length >= 2) {
            const delta = lastVal - firstVal;
            let color, arrow;
            if (metric === 'pct') {
                color = delta < -1 ? 'var(--c-green)' : delta > 1 ? 'var(--c-red)' : 'var(--c-text-3)';
                arrow = delta < -1 ? '↓' : delta > 1 ? '↑' : '→';
            } else {
                color = delta > 1 ? 'var(--c-green)' : delta < -1 ? 'var(--c-red)' : 'var(--c-text-3)';
                arrow = delta > 1 ? '↑' : delta < -1 ? '↓' : '→';
            }
            trendHtml = `<span style="color:${color}; font-weight:700;">${arrow} ${delta > 0 ? '+' : ''}${delta.toFixed(1)} п.п.</span>`;
        }
        html += `<td>${trendHtml}</td></tr>`;
    });
    html += `</tbody></table>`;
    document.getElementById('wpTable').innerHTML = html;

    const totalTasks = usersList.reduce((s, u) => s + (u.tasks ? u.tasks.length : 0), 0);
    let totalErr = 0;
    usersList.forEach(u => (u.tasks || []).forEach(t => { if (t.hasErrors) totalErr++; }));
    const avgErr = totalTasks ? (totalErr / totalTasks * 100).toFixed(1) : '0.0';
    document.getElementById('wpSummary').innerHTML = `👥 сотрудников: <b>${usersList.length}</b> · 📋 задач: <b>${totalTasks}</b> · ⚠️ средний % ошибок: <b>${avgErr}%</b> · 📅 периодов: <b>${keys.length}</b>`;
}

    }

        userBuckets[u.id] = { name: u.name, buckets: {} };

            const d = t.startDate || t.endDate;
            if (!d) return;
            if (fDateFrom && d < fDateFrom) return;
            if (fDateTo && d > fDateTo) return;
            const k = wpBucketKey(d, step);
            allBuckets.add(k);
            if (!userBuckets[u.id].buckets[k]) userBuckets[u.id].buckets[k] = { total: 0, err: 0, qSum: 0 };
            userBuckets[u.id].buckets[k].total++;
            if (t.hasErrors) userBuckets[u.id].buckets[k].err++;
            const q = (t.quality !== undefined && !isNaN(t.quality)) ? t.quality : 0;
            userBuckets[u.id].buckets[k].qSum += q;
        });
    });
    const keys = Array.from(allBuckets).sort();
    const cellValue = (b) => {
        if (!b || b.total === 0) return null;
        if (metric === 'pct') return (b.err / b.total) * 100;
        return (b.qSum / b.total) * 100;
    };

    const rows = [head];

function renderCompareGeneral() {
    const targetId = document.getElementById('cmpTarget').value;
    const aFrom = document.getElementById('cmpAFrom').value;
    const aTo = document.getElementById('cmpATo').value;
    const bFrom = document.getElementById('cmpBFrom').value;
    const bTo = document.getElementById('cmpBTo').value;

    const resBox = document.getElementById('cmpGeneralResult');
    const emptyBox = document.getElementById('cmpEmpty');

    if (!aFrom || !aTo || !bFrom || !bTo) {
        resBox.style.display = 'none'; emptyBox.style.display = 'block';
        return;
    }

    let usersToCalc = [];
    if (targetId === 'all') {
        usersToCalc = globalReport.filter(u => !(userCards[u.id]?.archived));
    } else {
        const u = globalReport.find(x => x.id === targetId);
        if (u) usersToCalc = [u];
    }

    const calcPeriod = (from, to) => {
        let total = 0, errors = 0;
        const cats = {};
        categoriesList.forEach(c => cats[c] = 0);
        usersToCalc.forEach(u => {
            (u.tasks || []).forEach(t => {
                const d = t.startDate || t.endDate;
                if (!d) return;
                if (d < from || d > to) return;
                total++;
                if (t.hasErrors) errors++;
                categoriesList.forEach(c => { if (t.cats[c]) cats[c]++; });
            });
        });
        return { total, errors, cats };
    };

    const statsA = calcPeriod(aFrom, aTo);
    const statsB = calcPeriod(bFrom, bTo);

    if (statsA.total === 0 && statsB.total === 0) {
        resBox.style.display = 'none';
        emptyBox.style.display = 'block';
        emptyBox.innerHTML = 'в выбранных периодах нет данных 🤷‍♀️';
        return;
    }

    resBox.style.display = 'block';
    emptyBox.style.display = 'none';

    const errA = statsA.errors;
    const errB = statsB.errors;
    let pctDiff = 0;
    if (errA > 0) pctDiff = Math.round(((errB - errA) / errA) * 100);
    else if (errB > 0) pctDiff = 100;

    const isGood = pctDiff <= 0;
    const bigPctEl = document.getElementById('cmpBigPct');
    bigPctEl.textContent = (pctDiff > 0 ? '+' : '') + pctDiff + '%';
    bigPctEl.style.color = isGood ? 'var(--c-green)' : 'var(--c-red)';

    let titleText = 'Ошибки без изменений';
    if (pctDiff < -10) titleText = 'Ошибки ↓ почти в 2 раза';
    else if (pctDiff < 0) titleText = 'Ошибки ↓';
    else if (pctDiff > 10) titleText = 'Ошибки ↑';
    else if (pctDiff > 0) titleText = 'Ошибки выросли';
    document.getElementById('cmpTitle').textContent = titleText;

    document.getElementById('cmpValA').textContent = errA;
    document.getElementById('cmpValB').textContent = errB;
    document.getElementById('cmpDateA').textContent = `${formatDateShort(aFrom)}–${formatDateShort(aTo)}`;
    document.getElementById('cmpDateB').textContent = `${formatDateShort(bFrom)}–${formatDateShort(bTo)}`;

    const catsEl = document.getElementById('cmpCats');
    let catsHtml = '';
    categoriesList.forEach(cat => {
        const a = statsA.cats[cat];
        const b = statsB.cats[cat];
        if (a === 0 && b === 0) return;
        let diff = 0;
        if (a > 0) diff = Math.round(((b - a) / a) * 100);
        else if (b > 0) diff = 100;
        const shortName = CAT_SHORT_LABELS[cat] ? CAT_SHORT_LABELS[cat].toLowerCase() : cat;
        const colorClass = diff <= 0 ? 'var(--c-green)' : 'var(--c-red)';
        const sign = diff > 0 ? '+' : '';
        catsHtml += `<div class="cmp-cat-item" style="padding:6px 12px; background:var(--c-surface-2); border-radius:14px; font-size:12px;">${shortName} <b style="color:${colorClass};">${sign}${diff}%</b></div>`;
    });
    catsEl.innerHTML = catsHtml || '<div style="color:var(--c-text-3);">нет ошибок в категориях</div>';

    const badge = document.getElementById('cmpFooterBadge');
    if (isGood) {
        badge.style.background = 'var(--c-green-soft)';
        badge.style.color = 'var(--c-green-text)';
        badge.innerHTML = '📊 динамика положительная';
    } else {
        badge.style.background = 'var(--c-red-soft)';
        badge.style.color = 'var(--c-red-text)';
        badge.innerHTML = '📊 динамика отрицательная';
    }
}

function getWeekRange(dateStr) {
    const d = new Date(dateStr + 'T00:00:00');
    const day = d.getDay() || 7;
    const mon = new Date(d); mon.setDate(d.getDate() - day + 1);
    const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
    return { start: mon.toISOString().slice(0,10), end: sun.toISOString().slice(0,10) };
}
function getQuarterRange(dateStr) {
    const d = new Date(dateStr + 'T00:00:00');
    const q = Math.floor(d.getMonth() / 3);
    const start = new Date(d.getFullYear(), q * 3, 1);
    const end = new Date(d.getFullYear(), q * 3 + 3, 0);
    return { start: start.toISOString().slice(0,10), end: end.toISOString().slice(0,10) };
}
function formatDateCmp(dateStr) {
    if (!dateStr) return '';
    const [y,m,d] = dateStr.split('-');
    return `${d}.${m}`;
}

function renderCompareTable() {
    const periodType = document.getElementById('cmpPeriodType').value;
    const from = document.getElementById('cmpDateFrom').value || '2000-01-01';
    const to = document.getElementById('cmpDateTo').value || '2099-12-31';

    const usersList = globalReport.filter(u => !(userCards[u.id]?.archived));
    if (usersList.length === 0) {
        document.getElementById('cmpTableContainer').innerHTML = '<p style="padding:20px; text-align:center; color:var(--c-text-3);">Нет данных для отображения. Загрузите отчёт в Сводке.</p>';
        document.getElementById('cmpKpi').innerHTML = '';
        return;
    }

    const periods = {};
    usersList.forEach(u => {
        (u.tasks || []).forEach(t => {
            const d = t.startDate || t.endDate;
            if (!d || d < from || d > to) return;

            let key, label;
            if (periodType === 'week') {
                const r = getWeekRange(d);
                key = r.start;
                label = `${formatDateCmp(r.start)}–${formatDateCmp(r.end)}`;
            } else if (periodType === 'month') {
                key = d.slice(0, 7);
                const dt = new Date(d + 'T00:00:00');
                const months = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
                label = months[dt.getMonth()] + ' ' + dt.getFullYear().toString().slice(2);
            } else if (periodType === 'quarter') {
                const r = getQuarterRange(d);
                key = r.start;
                const dt = new Date(r.start + 'T00:00:00');
                label = `Q${Math.floor(dt.getMonth() / 3) + 1} ${dt.getFullYear()}`;
            }
            if (!periods[key]) periods[key] = { label, tasks: [] };
            periods[key].tasks.push({ ...t, userId: u.id });
        });
    });

    const periodKeys = Object.keys(periods).sort();
    if (periodKeys.length === 0) {
        document.getElementById('cmpTableContainer').innerHTML = '<p style="padding:20px; text-align:center; color:var(--c-text-3);">Нет задач в выбранном диапазоне.</p>';
        document.getElementById('cmpKpi').innerHTML = '';
        return;
    }

    const userStats = {};
    usersList.forEach(u => { userStats[u.id] = { name: u.name, periods: {} }; });

    periodKeys.forEach(pk => {
        const pTasks = periods[pk].tasks;
        usersList.forEach(u => {
            const uTasks = pTasks.filter(t => t.userId === u.id);
            if (uTasks.length === 0) { userStats[u.id].periods[pk] = null; return; }
            const total = uTasks.length;
            const errors = uTasks.filter(t => t.hasErrors).length;
            const errPct = (errors / total) * 100;
            const qSum = uTasks.reduce((s, t) => s + (t.quality !== undefined ? t.quality : 0), 0);
            const avgQ = (qSum / total) * 100;
            userStats[u.id].periods[pk] = { total, errors, errPct, avgQ };
        });
    });

    let totalTasksAll = 0, totalErrorsAll = 0, sumQAll = 0;
    usersList.forEach(u => (u.tasks || []).forEach(t => {
        const d = t.startDate || t.endDate;
        if (d >= from && d <= to) {
            totalTasksAll++;
            if (t.hasErrors) totalErrorsAll++;
            sumQAll += (t.quality !== undefined ? t.quality : 0);
        }
    }));
    const avgErrAll = totalTasksAll ? (totalErrorsAll / totalTasksAll * 100) : 0;
    const avgQAll = totalTasksAll ? (sumQAll / totalTasksAll * 100) : 0;

    document.getElementById('cmpKpi').innerHTML = `
        <div class="progress-kpi" style="border-left-color:var(--c-primary);">
            <div class="lbl">Всего задач</div>
            <div class="val">${totalTasksAll}</div>
        </div>
        <div class="progress-kpi" style="border-left-color:var(--c-red);">
            <div class="lbl">С ошибками</div>
            <div class="val">${totalErrorsAll} <small style="font-size:14px; font-weight:500; color:var(--c-text-3);">(${avgErrAll.toFixed(1)}%)</small></div>
        </div>
        <div class="progress-kpi" style="border-left-color:var(--c-green);">
            <div class="lbl">Среднее качество</div>
            <div class="val">${avgQAll.toFixed(1)}%</div>
        </div>
    `;

    let html = `<table class="summary-table"><thead><tr>`;
    html += `<th style="text-align:left; min-width:150px;">Сотрудник</th>`;
    periodKeys.forEach(pk => {
        html += `<th title="задач | % ошибок | Q">${periods[pk].label}</th>`;
    });
    html += `<th>Тренд ошибок</th><th>Итог</th></tr></thead><tbody>`;

    const getQClass = (q) => {
        if (q >= 97) return 'q-green';
        if (q >= 86) return 'q-orange';
        return 'q-red';
    };

    usersList.sort((a,b)=>a.name.localeCompare(b.name)).forEach(u => {
        html += `<tr><td class="name-col">${u.name}</td>`;
        let firstErr = null, lastErr = null;

        periodKeys.forEach(pk => {
            const st = userStats[u.id].periods[pk];
            if (st) {
                const qClass = getQClass(st.avgQ);
                html += `<td class="${qClass}" style="line-height:1.3; padding:6px 8px;">
                    <div style="font-size:13px; font-weight:700;">${st.errPct.toFixed(1)}%</div>
                    <div style="font-size:10px; opacity:0.8;">Q: ${st.avgQ.toFixed(0)} | Задач: ${st.total}</div>
                </td>`;
                if (firstErr === null) firstErr = st.errPct;
                lastErr = st.errPct;
            } else {
                html += `<td style="color:#CCC;">—</td>`;
            }
        });

        if (firstErr !== null && lastErr !== null && periodKeys.length >= 2) {
            const delta = lastErr - firstErr;
            if (delta < -0.5) html += `<td class="trend-down">↓ ${Math.abs(delta).toFixed(1)} п.п.</td>`;
            else if (delta > 0.5) html += `<td class="trend-up">↑ ${delta.toFixed(1)} п.п.</td>`;
            else html += `<td class="trend-flat">→ 0 п.п.</td>`;
        } else {
            html += `<td style="color:#CCC;">—</td>`;
        }

        if (lastErr !== null) {
            let badge = '';
            if (lastErr <= 5) badge = '<span class="badge badge-good">Отлично</span>';
            else if (lastErr <= 15) badge = '<span class="badge badge-warn">Средне</span>';
            else badge = '<span class="badge badge-bad">Плохо</span>';
            html += `<td>${badge}</td>`;
        } else {
            html += `<td>—</td>`;
        }

        html += `</tr>`;
    });

    html += `</tbody></table>`;
    document.getElementById('cmpTableContainer').innerHTML = html;
}

    function renderAiAnalysis() {
    const targetId = document.getElementById('aiTarget').value;
    const from = document.getElementById('aiDateFrom').value || '2000-01-01';
    const to = document.getElementById('aiDateTo').value || '2099-12-31';

    const outBox = document.getElementById('aiOutputBox');
    const emptyBox = document.getElementById('aiEmpty');
    const content = document.getElementById('aiResultContent');

    if (!globalReport.length) {
        outBox.style.display = 'none'; emptyBox.style.display = 'block';
        emptyBox.innerHTML = 'Нет загруженных данных. Загрузите отчёт в Сводке.';
        return;
    }

    let targetUser = null;
    if (targetId !== 'all') targetUser = globalReport.find(u => u.id === targetId);

    if (targetId !== 'all' && !targetUser) {
        outBox.style.display = 'none'; emptyBox.style.display = 'block';
        return;
    }

    const tasks = [];
    if (targetId === 'all') {
        globalReport.forEach(u => {
            (u.tasks || []).forEach(t => {
                const d = t.startDate || t.endDate;
                if (d >= from && d <= to) tasks.push({ ...t, userName: u.name });
            });
        });
    } else {
        (targetUser.tasks || []).forEach(t => {
            const d = t.startDate || t.endDate;
            if (d >= from && d <= to) tasks.push({ ...t, userName: targetUser.name });
        });
    }

    if (tasks.length === 0) {
        outBox.style.display = 'none'; emptyBox.style.display = 'block';
        emptyBox.innerHTML = 'В выбранном периоде нет задач.';
        return;
    }

    outBox.style.display = 'block';
    emptyBox.style.display = 'none';

    const total = tasks.length;
    const errCount = tasks.filter(t => t.hasErrors).length;
    const errPct = (errCount / total) * 100;
    const avgQ = tasks.reduce((s, t) => s + (t.quality || 0), 0) / total * 100;

    const catCounts = {};
    categoriesList.forEach(c => catCounts[c] = 0);
    tasks.forEach(t => categoriesList.forEach(c => { if (t.cats[c]) catCounts[c]++; }));
    const catPct = {};
    categoriesList.forEach(c => catPct[c] = (catCounts[c] / total) * 100);

    const sortedTasks = tasks.slice().sort((a,b) => (a.startDate||'').localeCompare(b.startDate||''));
    const mid = Math.floor(sortedTasks.length / 2);
    const firstHalf = sortedTasks.slice(0, mid);
    const secondHalf = sortedTasks.slice(mid);
    const rateFirst = firstHalf.length ? (firstHalf.filter(t=>t.hasErrors).length / firstHalf.length * 100) : 0;
    const rateSecond = secondHalf.length ? (secondHalf.filter(t=>t.hasErrors).length / secondHalf.length * 100) : 0;
    const trendDelta = rateSecond - rateFirst;

    let title = targetId === 'all' ? 'Анализ по всей команде' : `Анализ: ${targetUser.name}`;
    let subtitle = `Период: ${formatDateShort(from)} – ${formatDateShort(to)} · Задач: ${total}`;

    let insightsHtml = '';
    insightsHtml += `<div class="ai-insight"><span style="font-size:16px;">📊</span><span><b>Всего задач:</b> ${total} (с ошибками: ${errCount})</span></div>`;
    insightsHtml += `<div class="ai-insight"><span style="font-size:16px;">🎯</span><span><b>% ошибок:</b> ${errPct.toFixed(1)}%</span></div>`;
    insightsHtml += `<div class="ai-insight"><span style="font-size:16px;">⭐</span><span><b>Среднее качество:</b> ${avgQ.toFixed(1)}%</span></div>`;

    if (trendDelta < -3) {
        insightsHtml += `<div class="ai-insight good"><span style="font-size:16px;">📈</span><span><b>Тренд:</b> Качество растёт. Во второй половине периода ошибок стало меньше на ${Math.abs(trendDelta).toFixed(1)} п.п.</span></div>`;
    } else if (trendDelta > 3) {
        insightsHtml += `<div class="ai-insight bad"><span style="font-size:16px;">📉</span><span><b>Тренд:</b> Качество падает. Во второй половине периода ошибок стало больше на ${trendDelta.toFixed(1)} п.п.</span></div>`;
    } else {
        insightsHtml += `<div class="ai-insight warn"><span style="font-size:16px;">➡️</span><span><b>Тренд:</b> Стабильно. Уровень ошибок держится примерно на одном уровне.</span></div>`;
    }

    const problemCats = categoriesList.filter(c => catCounts[c] > 0).sort((a,b) => catPct[b] - catPct[a]).slice(0, 3);
    if (problemCats.length > 0) {
        insightsHtml += `<div class="ai-insight bad"><span style="font-size:16px;">⚠️</span><span><b>Топ ошибок:</b> ${problemCats.map(c => `${CAT_SHORT_LABELS[c] || c} (${catCounts[c]})`).join(', ')}</span></div>`;
    } else {
        insightsHtml += `<div class="ai-insight good"><span style="font-size:16px;">✅</span><span>Ошибок по категориям не зафиксировано.</span></div>`;
    }

    let categoriesHtml = `<div class="progress-table-wrap" style="box-shadow:none; padding:0; margin-top:10px;">
        <table class="progress-table">
            <thead><tr><th style="text-align:left;">Категория</th><th>Кол-во ошибок</th><th>Доля от всех задач</th></tr></thead>
            <tbody>`;
    categoriesList.forEach(cat => {
        if (catCounts[cat] === 0) return;
        categoriesHtml += `<tr>
            <td class="period-col">${CAT_SHORT_LABELS[cat] || cat}</td>
            <td style="color:var(--c-red); font-weight:700;">${catCounts[cat]}</td>
            <td>${catPct[cat].toFixed(1)}%</td>
        </tr>`;
    });
    categoriesHtml += `</tbody></table></div>`;

    let perUserHtml = '';
    if (targetId === 'all') {
        perUserHtml = `<div style="margin-top:20px;">
            <h4>Разбивка по сотрудникам</h4>
            <div class="progress-table-wrap" style="box-shadow:none; padding:0;">
                <table class="progress-table">
                    <thead><tr><th style="text-align:left;">Сотрудник</th><th>Задач</th><th>С ошибками</th><th>% ошибок</th><th>Качество</th></tr></thead>
                    <tbody>`;
        const byUser = {};
        tasks.forEach(t => {
            if (!byUser[t.userName]) byUser[t.userName] = { total: 0, err: 0, qSum: 0 };
            byUser[t.userName].total++;
            if (t.hasErrors) byUser[t.userName].err++;
            byUser[t.userName].qSum += (t.quality || 0);
        });
        Object.entries(byUser).sort((a,b) => b[1].err - a[1].err).forEach(([name, st]) => {
            const pct = (st.err / st.total * 100).toFixed(1);
            const q = (st.qSum / st.total * 100).toFixed(1);
            perUserHtml += `<tr>
                <td class="period-col">${name}</td>
                <td>${st.total}</td>
                <td>${st.err}</td>
                <td><b>${pct}%</b></td>
                <td>${q}%</td>
            </tr>`;
        });
        perUserHtml += `</tbody></table></div></div>`;
    }

    content.innerHTML = `
        <h2 style="margin-top:0; margin-bottom:6px; font-size:20px;">${title}</h2>
        <div style="font-size:13px; color:var(--c-text-2); margin-bottom:20px;">${subtitle}</div>

        <div style="margin-bottom:20px;">
            <h4>💡 Ключевые выводы</h4>
            ${insightsHtml}
        </div>

        <div style="margin-bottom:20px;">
            <h4>🧩 Ошибки по категориям</h4>
            ${categoriesHtml}
        </div>

        ${perUserHtml}
    `;
}

function isoToday() { const d = new Date(); return d.toISOString().slice(0,10); }

function applyReportPreset(val) {
    const fromEl = document.getElementById('repDateFrom');
    const toEl = document.getElementById('repDateTo');
    const today = new Date();
    const to = isoToday();
    let from;
    if (val === 'week') { const d = new Date(today); d.setDate(d.getDate() - 7); from = d.toISOString().slice(0,10); }
    else if (val === '2weeks') { const d = new Date(today); d.setDate(d.getDate() - 14); from = d.toISOString().slice(0,10); }
    else if (val === 'month') { const d = new Date(today); d.setDate(d.getDate() - 30); from = d.toISOString().slice(0,10); }
    else if (val === 'quarter') { const d = new Date(today); d.setDate(d.getDate() - 90); from = d.toISOString().slice(0,10); }
    else { return; }
    fromEl.value = from; toEl.value = to;
    renderManagerReport();
    debouncedSaveSettings();
}

function prevPeriod(from, to) {
    const f = new Date(from + 'T00:00:00');
    const t = new Date(to + 'T00:00:00');
    const days = Math.max(1, Math.round((t - f) / 86400000) + 1);
    const pTo = new Date(f); pTo.setDate(pTo.getDate() - 1);
    const pFrom = new Date(pTo); pFrom.setDate(pFrom.getDate() - days + 1);
    return { from: pFrom.toISOString().slice(0,10), to: pTo.toISOString().slice(0,10) };
}

function getReportUsers() {
    const group = document.getElementById('repGroup')?.value || 'all';
    return globalReport.filter(u => {
        if (userCards[u.id]?.archived) return false;
        const m = userMarks[u.id];
        if (group === 'newbie' && m !== 'newbie') return false;
        if (group === 'experienced' && m !== 'experienced') return false;
        return true;
    });
}

function aggregatePeriod(users, from, to) {
    const cats = {}; categoriesList.forEach(c => cats[c] = 0);
    const byUser = {}; const byDay = {};
    let total = 0, errors = 0, qSum = 0;
    users.forEach(u => {
        byUser[u.id] = { id: u.id, name: u.name, total: 0, errors: 0, cats: {}, qSum: 0 };
        categoriesList.forEach(c => byUser[u.id].cats[c] = 0);
        (u.tasks || []).forEach(t => {
            const d = t.startDate || t.endDate;
            if (!d) return;
            if (from && d < from) return;
            if (to && d > to) return;
            total++;
            byUser[u.id].total++;
            const q = (t.quality !== undefined && !isNaN(t.quality)) ? t.quality : 0;
            qSum += q; byUser[u.id].qSum += q;
            if (t.hasErrors) { errors++; byUser[u.id].errors++; }
            categoriesList.forEach(c => {
                if (t.cats[c]) { cats[c]++; byUser[u.id].cats[c]++; }
            });
            if (!byDay[d]) byDay[d] = { total: 0, errors: 0 };
            byDay[d].total++;
            if (t.hasErrors) byDay[d].errors++;
        });
    });
    return { total, errors, qSum, avgQ: total ? (qSum/total*100) : 0,
             errPct: total ? (errors/total*100) : 0, cats, byUser, byDay };
}

function renderManagerReport() {
    const body = document.getElementById('repBody');
    if (!body) return;
    const from = document.getElementById('repDateFrom').value;
    const to = document.getElementById('repDateTo').value;
    if (!from || !to) { body.innerHTML = '<p style="color:var(--c-text-3); padding:20px;">выбери период.</p>'; return; }
    if (!globalReport || !globalReport.length) {
        body.innerHTML = '<p style="color:var(--c-text-3); padding:20px;">сначала загрузи данные в «Сводке».</p>';
        return;
    }

    const users = getReportUsers();
    const cur = aggregatePeriod(users, from, to);
    const doCompare = document.getElementById('repCompare').checked;
    const prev = doCompare ? prevPeriod(from, to) : null;
    const old = doCompare ? aggregatePeriod(users, prev.from, prev.to) : null;

    body.innerHTML =
        renderReportKpi(cur, old, from, to, prev) +
        renderReportErrorsTable(cur, old, from, to) +
        renderReportInsights(cur, old, prev) +
        renderReportUsersTable(cur, old) +
        renderReportHeatmap(users, from, to);
}

function deltaSpan(cur, old, invert) {
    if (old === null || old === undefined) return '';
    const d = cur - old;
    if (Math.abs(d) < 0.01) return `<span style="color:var(--c-text-3); font-size:12px;"> → 0</span>`;
    const isGood = invert ? d < 0 : d > 0;
    const color = isGood ? 'var(--c-green)' : 'var(--c-red)';
    const sign = d > 0 ? '+' : '';
    return `<span style="color:${color}; font-size:12px; font-weight:700;"> ${d>0?'↑':'↓'} ${sign}${d.toFixed(1)}</span>`;
}

function renderReportKpi(cur, old, from, to, prev) {
    const cmp = old ? `<div class="sub" style="font-size:11px; color:var(--c-text-3);">vs ${prev.from}–${prev.to}</div>` : '';
    return `
    <div class="progress-kpi-grid" style="display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; margin-bottom:20px;">
        <div class="progress-kpi" style="border-left-color:var(--c-primary);">
            <div class="lbl">Задач за период</div>
            <div class="val">${cur.total}${old ? deltaSpan(cur.total, old.total, false) : ''}</div>
            ${cmp}
        </div>
        <div class="progress-kpi" style="border-left-color:var(--c-red);">
            <div class="lbl">С ошибками</div>
            <div class="val">${cur.errors}${old ? deltaSpan(cur.errors, old.errors, true) : ''}</div>
            ${cmp}
        </div>
        <div class="progress-kpi" style="border-left-color:var(--c-orange);">
            <div class="lbl">% ошибок</div>
            <div class="val">${cur.errPct.toFixed(1)}%${old ? deltaSpan(cur.errPct, old.errPct, true) : ''}</div>
            ${cmp}
        </div>
        <div class="progress-kpi" style="border-left-color:var(--c-green);">
            <div class="lbl">Среднее качество</div>
            <div class="val">${cur.avgQ.toFixed(1)}%${old ? deltaSpan(cur.avgQ, old.avgQ, false) : ''}</div>
            ${cmp}
        </div>
    </div>`;
}

function renderReportErrorsTable(cur, old, from, to) {
    const rows = categoriesList.map(c => {
        const cv = cur.cats[c] || 0;
        const ov = old ? (old.cats[c] || 0) : null;
        let delta = null;
        if (ov !== null) {
            if (ov === 0 && cv === 0) delta = 0;
            else if (ov === 0) delta = null;
            else delta = ((cv - ov) / ov) * 100;
        }
        let trend = '→';
        if (delta !== null) {
            if (delta < -5) trend = '↓';
            else if (delta > 5) trend = '↑';
        }
        let status = '';
        if (old) {
            if (ov === 0 && cv > 0) status = '<span style="color:var(--c-red); font-weight:700;">новое</span>';
            else if (ov > 0 && cv === 0) status = '<span style="color:var(--c-green); font-weight:700;">ушло</span>';
            else if (delta !== null && delta < -5) status = '<span style="color:var(--c-green);">падает</span>';
            else if (delta !== null && delta > 5) status = '<span style="color:var(--c-red);">растёт</span>';
            else status = '<span style="color:var(--c-text-3);">стабильно</span>';
        }
        const pct = cur.total ? (cv / cur.total * 100) : 0;
        if (cv === 0 && (old === null || ov === 0)) return '';
        return `<tr>
            <td><a class="rep-cat-link" onclick="openDrillDown('${c.replace(/'/g,"\\'")}','${from}','${to}'); return false;">${CAT_SHORT_LABELS[c] || c}</a></td>
            <td>${cv}</td>
            <td>${pct.toFixed(1)}%</td>
            <td>${ov === null ? '—' : ov}</td>
            <td>${delta === null ? '—' : (delta > 0 ? '+' : '') + delta.toFixed(0) + '%'}</td>
            <td>${trend}</td>
            <td>${status || '—'}</td>
        </tr>`;
    }).filter(Boolean).join('');

    if (!rows) return '<div class="card-block" style="margin-bottom:20px;"><h4>типовые ошибки</h4><p style="color:var(--c-text-3);">ошибок за период нет 🎉</p></div>';

    return `<div class="card-block" style="margin-bottom:20px; border-left-color:var(--c-red);">
        <h4>типовые ошибки за период (клик по названию → список конкретных)</h4>
        <div class="progress-table-wrap">
            <table class="progress-table">
                <thead><tr>
                    <th style="text-align:left;">категория</th>
                    <th>кол-во</th>
                    <th>доля от задач</th>
                    <th>было</th>
                    <th>Δ %</th>
                    <th>тренд</th>
                    <th>статус</th>
                </tr></thead>
                <tbody>${rows}</tbody>
            </table>
        </div>
    </div>`;
}

function renderReportInsights(cur, old, prev) {
    const ins = [];
    if (old) {
        categoriesList.forEach(c => {
            const cv = cur.cats[c] || 0, ov = old.cats[c] || 0;
            if (ov === 0 && cv > 0) ins.push({ icon: '🆕', type: 'bad', text: `Новая ошибка: «${CAT_SHORT_LABELS[c]||c}» — ${cv} случаев (раньше не было)` });
            if (ov > 0 && cv === 0) ins.push({ icon: '✅', type: 'good', text: `Ушло: «${CAT_SHORT_LABELS[c]||c}» — было ${ov}, теперь 0` });
            if (ov > 0 && cv > 0) {
                const d = ((cv - ov) / ov) * 100;
                if (d > 20) ins.push({ icon: '🚨', type: 'bad', text: `Растёт: «${CAT_SHORT_LABELS[c]||c}» +${d.toFixed(0)}% (${ov} → ${cv})` });
                else if (d < -20) ins.push({ icon: '📈', type: 'good', text: `Снижается: «${CAT_SHORT_LABELS[c]||c}» ${d.toFixed(0)}% (${ov} → ${cv})` });
            }
        });
    }
    const catTop = categoriesList.map(c => ({c, v: cur.cats[c]||0})).sort((a,b)=>b.v-a.v)[0];
    if (catTop && catTop.v > 0) {
        const involved = Object.values(cur.byUser).filter(u => (u.cats[catTop.c]||0) > 0)
            .sort((a,b) => (b.cats[catTop.c]||0) - (a.cats[catTop.c]||0)).slice(0,3).map(u => u.name.split(' ')[0]);
        if (involved.length) ins.push({ icon: '🎯', type: 'warn', text: `Топ ошибка «${CAT_SHORT_LABELS[catTop.c]||catTop.c}» — ${catTop.v} случаев. Чаще всего у: ${involved.join(', ')}` });
    }
    const days = Object.entries(cur.byDay).map(([d,v]) => ({ d, rate: v.total ? v.errors/v.total*100 : 0, total: v.total }));
    if (days.length >= 5) {
        const mean = days.reduce((s,x)=>s+x.rate,0)/days.length;
        const std = Math.sqrt(days.reduce((s,x)=>s+Math.pow(x.rate-mean,2),0)/days.length);
        days.forEach(x => {
            if (x.total >= 3 && x.rate > mean + 2*std && x.rate > 10)
                ins.push({ icon: '⚠️', type: 'bad', text: `Аномальный день ${x.d}: ${x.rate.toFixed(1)}% ошибок (среднее ${mean.toFixed(1)}%)` });
        });
    }
    if (!ins.length) ins.push({ icon: '✅', type: 'good', text: 'Существенных изменений и аномалий не выявлено.' });
    return `<div class="card-block" style="margin-bottom:20px; border-left-color:var(--c-primary);">
        <h4>💡 инсайты</h4>
        <div style="display:flex; flex-direction:column; gap:8px;">
            ${ins.map(i => `<div style="display:flex; gap:10px; padding:10px 14px; background:var(--c-surface); border-radius:8px; border-left:3px solid ${i.type==='good'?'var(--c-green)':i.type==='bad'?'var(--c-red)':'var(--c-orange)'};">
                <span style="font-size:16px;">${i.icon}</span><span style="font-size:13px;">${i.text}</span>
            </div>`).join('')}
        </div>
    </div>`;
}

function renderReportUsersTable(cur, old) {
    const rows = Object.values(cur.byUser).map(u => {
        const oldU = old ? (old.byUser[u.id] || null) : null;
        const errPct = u.total ? (u.errors/u.total*100) : 0;
        const oldPct = oldU && oldU.total ? (oldU.errors/oldU.total*100) : null;
        const delta = oldPct !== null ? errPct - oldPct : null;
        const topCat = categoriesList.map(c => ({c, v: u.cats[c]||0})).sort((a,b)=>b.v-a.v)[0];
        let badge = '';
        if (errPct <= 5) badge = '<span class="badge badge-good">отлично</span>';
        else if (errPct <= 15) badge = '<span class="badge badge-warn">средне</span>';
        else badge = '<span class="badge badge-bad">плохо</span>';
        return `<tr onclick="openCard('${u.id}')" style="cursor:pointer;">
            <td class="period-col">${u.name}</td>
            <td>${u.total}</td>
            <td>${u.errors}</td>
            <td><b>${errPct.toFixed(1)}%</b></td>
            <td>${delta === null ? '—' : `<span style="color:${delta<0?'var(--c-green)':delta>0?'var(--c-red)':'var(--c-text-3)'}; font-weight:700;">${delta>0?'+':''}${delta.toFixed(1)} п.п.</span>`}</td>
            <td>${topCat && topCat.v ? (CAT_SHORT_LABELS[topCat.c]||topCat.c) + ' (' + topCat.v + ')' : '—'}</td>
            <td>${badge}</td>
        </tr>`;
    }).join('');
    if (!rows) return '';
    return `<div class="card-block" style="margin-bottom:20px; border-left-color:var(--c-purple);">
        <h4>разрез по сотрудникам (клик → карточка)</h4>
        <div class="progress-table-wrap">
            <table class="progress-table">
                <thead><tr>
                    <th style="text-align:left;">сотрудник</th><th>задач</th><th>с ошиб.</th><th>% ошибок</th><th>Δ к прошлому</th><th>топ-ошибка</th><th>статус</th>
                </tr></thead>
                <tbody>${rows}</tbody>
            </table>
        </div>
    </div>`;
}

function renderReportHeatmap(users, from, to) {
    const days = ['пн','вт','ср','чт','пт','сб','вс'];
    const hours = Array.from({length:24},(_,i)=>i);
    const grid = {}; days.forEach(d => { grid[d] = {}; hours.forEach(h => grid[d][h] = 0); });
    let max = 0;
    users.forEach(u => (u.tasks || []).forEach(t => {
        const raw = t.startTime || t.startDate;
        if (!raw) return;
        const dStr = raw.slice(0,10);
        if (from && dStr < from) return;
        if (to && dStr > to) return;
        if (!t.hasErrors) return;
        const dt = new Date(raw.includes('T') ? raw : raw + 'T00:00:00');
        if (isNaN(dt)) return;
        const day = days[(dt.getDay()||7)-1];
        const h = dt.getHours();
        grid[day][h]++;
        if (grid[day][h] > max) max = grid[day][h];
    }));
    if (max === 0) return '';
    const colorFor = (v) => {
        if (!v) return 'transparent';
        const a = Math.min(1, 0.15 + (v/max)*0.85);
        return `rgba(239,68,68,${a.toFixed(2)})`;
    };
    let html = `<div class="card-block" style="margin-bottom:20px; border-left-color:var(--c-orange);">
        <h4>🔥 тепловая карта ошибок: день недели × час (по времени начала задачи)</h4>
        <div style="overflow-x:auto;">
        <table style="border-collapse:collapse; font-size:11px;">
            <thead><tr><th style="padding:4px 8px;"></th>${hours.map(h=>`<th style="padding:2px; color:var(--c-text-3); font-weight:600;">${h}</th>`).join('')}</tr></thead>
            <tbody>`;
    days.forEach(d => {
        html += `<tr><td style="padding:4px 8px; font-weight:700; color:var(--c-text-2);">${d}</td>`;
        hours.forEach(h => {
            const v = grid[d][h];
            html += `<td title="${d} ${h}:00 — ${v}" style="width:22px; height:22px; background:${colorFor(v)}; border:1px solid var(--c-border); text-align:center; color:${v && v/max > 0.6 ? '#FFF' : 'var(--c-text-2)'}; font-weight:600;">${v || ''}</td>`;
        });
        html += `</tr>`;
    });
    html += `</tbody></table></div></div>`;
    return html;
}

/* ===================== DRILL-DOWN ===================== */

function openDrillDown(category, from, to) {
    const overlay = document.getElementById('drillOverlay');
    const content = document.getElementById('drillModalContent');
    if (!overlay || !content) return;
    const items = [];
    globalReport.forEach(u => {
        (taskComments[u.id] || []).forEach(c => {
            if (c.category !== category) return;
            const d = c.date || (c.taskStart ? c.taskStart.slice(0,10) : '');
            if (from && d < from) return;
            if (to && d > to) return;
            items.push({ user: u.name, date: d, time: c.taskStart ? c.taskStart.slice(11,16) : '', text: c.text });
        });
    });
    items.sort((a,b) => (b.date || '').localeCompare(a.date || ''));
    const listHtml = items.length === 0
        ? '<p style="color:var(--c-text-3);">за период записей нет.</p>'
        : items.map(it => `
            <div class="comment-item" style="margin-bottom:8px;">
                <span class="comment-date">${it.date}${it.time ? ' ' + it.time : ''}</span>
                <span class="comment-cat">${escapeHtml(it.user)}</span>
                <div style="margin-top:6px;">${escapeHtml(it.text)}</div>
            </div>`).join('');
    content.innerHTML = `
        <button class="modal-close" onclick="closeDrillDown()">×</button>
        <h3 style="margin-top:0;">${CAT_SHORT_LABELS[category] || category}</h3>
        <div style="font-size:13px; color:var(--c-text-2); margin-bottom:14px;">Период ${from}–${to} · записей: <b>${items.length}</b></div>
        <div style="max-height:60vh; overflow-y:auto;">${listHtml}</div>
        <div class="modal-actions" style="margin-top:16px;">
            <button class="btn-cancel" onclick="closeDrillDown()">закрыть</button>
        </div>
    `;
    overlay.classList.add('open');
}

function closeDrillDown() {
    const overlay = document.getElementById('drillOverlay');
    if (overlay) overlay.classList.remove('open');
}

/* ===================== ЭКСПОРТ ОТЧЁТА ===================== */

function exportManagerReportExcel() {
    if (!globalReport || !globalReport.length) { alert('нет данных'); return; }
    if (typeof XLSX === 'undefined') { alert('XLSX не подключён'); return; }
    const from = document.getElementById('repDateFrom').value;
    const to = document.getElementById('repDateTo').value;
    const users = getReportUsers();
    const cur = aggregatePeriod(users, from, to);
    const doCompare = document.getElementById('repCompare').checked;
    const prev = doCompare ? prevPeriod(from, to) : null;
    const old = doCompare ? aggregatePeriod(users, prev.from, prev.to) : null;
    const wb = XLSX.utils.book_new();

    const summary = [
        ['Период', `${from} — ${to}`],
        ['Сравнение', doCompare ? `${prev.from} — ${prev.to}` : 'нет'],
        ['Всего задач', cur.total],
        ['С ошибками', cur.errors],
        ['% ошибок', cur.errPct.toFixed(1) + '%'],
        ['Среднее качество', cur.avgQ.toFixed(1) + '%']
    ];
    if (old) {
        summary.push([]);
        summary.push(['Δ задач', cur.total - old.total]);
        summary.push(['Δ ошибок', cur.errors - old.errors]);
        summary.push(['Δ % ошибок', (cur.errPct - old.errPct).toFixed(1) + ' п.п.']);
        summary.push(['Δ качества', (cur.avgQ - old.avgQ).toFixed(1) + ' п.п.']);
    }
    const note = document.getElementById('repManagerNote')?.value;
    if (note) { summary.push([]); summary.push(['Комментарий менеджера', note]); }
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(summary), 'Сводка');

    const errHead = ['категория', 'кол-во', 'доля %', 'было', 'Δ %'];
    const errRows = [errHead];
    categoriesList.forEach(c => {
        const cv = cur.cats[c]||0, ov = old ? (old.cats[c]||0) : null;
        let d = '';
        if (ov !== null) { if (ov === 0 && cv === 0) d = '0'; else if (ov === 0) d = 'новое'; else d = ((cv - ov) / ov * 100).toFixed(0) + '%'; }
        errRows.push([CAT_SHORT_LABELS[c] || c, cv, cur.total ? (cv/cur.total*100).toFixed(1) : '0', ov === null ? '' : ov, d]);
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(errRows), 'Ошибки');

    const uHead = ['сотрудник', 'задач', 'с ошиб.', '% ошибок', 'топ-ошибка'];
    if (old) uHead.push('Δ % ошибок');
    const uRows = [uHead];
    Object.values(cur.byUser).forEach(u => {
        const errPct = u.total ? (u.errors/u.total*100) : 0;
        const topCat = categoriesList.map(c => ({c, v: u.cats[c]||0})).sort((a,b)=>b.v-a.v)[0];
        const row = [u.name, u.total, u.errors, errPct.toFixed(1) + '%', topCat && topCat.v ? (CAT_SHORT_LABELS[topCat.c]||topCat.c) + ' (' + topCat.v + ')' : '—'];
        if (old) {
            const oldU = old.byUser[u.id];
            const oldPct = oldU && oldU.total ? (oldU.errors/oldU.total*100) : null;
            row.push(oldPct === null ? '' : (errPct - oldPct).toFixed(1) + ' п.п.');
        }
        uRows.push(row);
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(uRows), 'Сотрудники');

    const dHead = ['дата', 'задач', 'с ошибками', '% ошибок'];
    const dRows = [dHead];
    Object.entries(cur.byDay).sort().forEach(([d, v]) => {
        dRows.push([d, v.total, v.errors, (v.total ? v.errors/v.total*100 : 0).toFixed(1) + '%']);
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(dRows), 'Динамика по дням');

    XLSX.writeFile(wb, `итоговый_отчет_${from}_${to}.xlsx`);
    showToast('отчёт экспортирован');
}

function exportManagerReportPdf() {
    const body = document.getElementById('repBody');
    if (!body || !body.innerHTML.trim()) { alert('сначала постройте отчёт'); return; }
    window.print();
}
